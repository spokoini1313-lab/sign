<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Signal Pro — מערכת איתותים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{
  --bg:#07090d; --bg2:#0b0f16; --card:#0f141d; --card2:#141b27; --card3:#1a2232;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.1);
  --txt:#eef2f8; --dim:#94a0b4; --faint:#5e6a7e;
  --gold:#e8b85a; --gold2:#f5d48e; --teal:#2dd4bf; --blue:#60a5fa;
  --up:#22c55e; --upbg:rgba(34,197,94,.09); --upln:rgba(34,197,94,.28);
  --down:#ef4444; --downbg:rgba(239,68,68,.09); --downln:rgba(239,68,68,.28);
  --amber:#f59e0b; --amberbg:rgba(245,158,11,.1);
  --r:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:14.5px;line-height:1.55;
  background:
    radial-gradient(1100px 600px at 100% -10%,rgba(232,184,90,.07),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(45,212,191,.05),transparent 60%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--txt);background:var(--bg2);
  border:1px solid var(--line2);border-radius:9px;padding:9px 11px;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,90,.12)}
label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:500}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#222b3a;border-radius:8px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-inline-end:1px solid var(--line);
  background:linear-gradient(180deg,rgba(15,20,29,.85),rgba(7,9,13,.85));backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#1a1204;
  background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(232,184,90,.3)}
.logo b{font-size:16px;letter-spacing:.2px}.logo small{display:block;font-size:10.5px;color:var(--faint);margin-top:-2px}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--dim);font-size:14px;font-weight:500;transition:all .15s;width:100%;text-align:right}
.nav-i:hover{background:var(--card2);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(232,184,90,.14),rgba(232,184,90,.03));color:var(--gold2);box-shadow:inset -2px 0 0 var(--gold)}
.nav-i svg{width:18px;height:18px;flex-shrink:0}
.nav-i .cnt{margin-inline-start:auto;font-size:10.5px;background:var(--card3);color:var(--dim);padding:1px 7px;border-radius:999px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.side-foot .row{display:flex;justify-content:space-between;margin:3px 0}

main{min-width:0;padding:0 26px 40px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 0 14px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.2px}
.top .sub{font-size:12px;color:var(--faint)}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--up);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
.dot.err{background:var(--down)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.timer{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204;box-shadow:0 6px 18px rgba(232,184,90,.22)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,184,90,.32)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--txt)}
.btn.ghost:hover{background:var(--card3)}
.btn.dz{background:var(--downbg);border:1px solid var(--downln);color:#fca5a5}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.ic{padding:6px 8px}
.btn svg{width:15px;height:15px}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--card),rgba(15,20,29,.7));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600}
.card-h .c{font-size:11.5px;color:var(--faint)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.6fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi .k{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);font-weight:500}
.kpi .k i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--card3)}
.kpi .v{font-size:25px;font-weight:700;margin-top:8px;letter-spacing:-.4px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:4px}
.kpi .spark{position:absolute;inset-inline-start:10px;bottom:10px;opacity:.9}
.bar{height:6px;border-radius:6px;background:var(--card3);overflow:hidden;margin-top:9px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.up{color:var(--up)}.down{color:var(--down)}.amber{color:var(--amber)}.dim{color:var(--dim)}.faint{color:var(--faint)}.gold{color:var(--gold2)}

/* ---------- positions ---------- */
.pos{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.pos-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pos-h b{font-size:15px}
.track{position:relative;height:8px;border-radius:8px;margin:14px 0 6px;
  background:linear-gradient(90deg,rgba(239,68,68,.55),rgba(239,68,68,.15) 33%,rgba(148,160,180,.18) 33.5%,rgba(34,197,94,.15) 34%,rgba(34,197,94,.55))}
.track .mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(50%,-50%);background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.track .en{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--dim);transform:translateX(50%)}
.track-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:620px;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;z-index:2;background:#111723;text-align:right;color:var(--dim);font-weight:600;font-size:11px;
  padding:10px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;letter-spacing:.2px}
.t td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tbody tr{transition:background .12s}
.t tbody tr:hover td{background:rgba(255,255,255,.025)}
.t tr.win td{background:var(--upbg)} .t tr.win td:first-child{box-shadow:inset -3px 0 0 var(--up)}
.t tr.loss td{background:var(--downbg)} .t tr.loss td:first-child{box-shadow:inset -3px 0 0 var(--down)}
.t tr.be td{background:var(--amberbg)} .t tr.be td:first-child{box-shadow:inset -3px 0 0 var(--amber)}
.t tr.open td:first-child{box-shadow:inset -3px 0 0 var(--blue)}
.t input,.t select{padding:6px 8px;font-size:12.5px;border-radius:7px;background:transparent;border-color:transparent;min-width:70px}
.t input:hover,.t select:hover{border-color:var(--line2);background:var(--bg2)}
.t input:focus,.t select:focus{background:var(--bg2)}
.t .note-in{min-width:220px}
.t td.edited{position:relative}
.t td.edited::after{content:"✎";position:absolute;top:3px;inset-inline-start:4px;font-size:9px;color:var(--gold)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.2px}
.b-w{background:rgba(34,197,94,.16);color:#86efac}.b-l{background:rgba(239,68,68,.16);color:#fca5a5}
.b-o{background:rgba(96,165,250,.15);color:#93c5fd}.b-be{background:rgba(245,158,11,.16);color:#fcd34d}
.b-s{background:rgba(45,212,191,.14);color:#5eead4}.b-g{background:var(--card3);color:var(--dim)}
.b-gold{background:rgba(232,184,90,.15);color:var(--gold2)}

/* ---------- chips / toolbar ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--dim);font-weight:500}
.chip.on{background:rgba(232,184,90,.13);border-color:rgba(232,184,90,.4);color:var(--gold2)}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{padding-inline-start:34px}
.search svg{position:absolute;top:50%;inset-inline-start:11px;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}

/* ---------- settings ---------- */
.set-sec{margin-bottom:22px}
.set-sec h3{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.set-sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sl{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sl-h label{margin:0}.sl-h b{font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}
.sl small{display:block;font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.5}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;padding:0;border:none;border-radius:5px;background:var(--card3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer;box-shadow:0 2px 8px rgba(232,184,90,.4)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--gold);cursor:pointer}
input[type=range]:focus{box-shadow:none}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.preset{text-align:right;padding:13px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:all .15s}
.preset:hover{border-color:var(--line2);background:var(--card2)}
.preset.on{border-color:rgba(232,184,90,.5);background:rgba(232,184,90,.07)}
.preset b{display:block;font-size:13.5px;margin-bottom:3px}.preset span{font-size:11px;color:var(--faint)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;background:var(--bg2);border:1px solid var(--line);border-radius:11px}
.tog div{font-size:13px}.tog small{display:block;font-size:11px;color:var(--faint)}
.sw{position:relative;width:40px;height:22px;border-radius:22px;background:var(--card3);flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#cbd5e1;transition:all .2s}
.sw.on{background:linear-gradient(135deg,var(--gold2),var(--gold))}.sw.on::after{right:21px;background:#1a1204}
.preview{position:sticky;top:84px}
.pv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pv-row:last-child{border:none}.pv-row b{font-variant-numeric:tabular-nums}
.symchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sym{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 11px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);font-size:12.5px;font-weight:600}
.sym.off{opacity:.45;text-decoration:line-through}
.sym button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.sym button:hover{background:var(--card3);color:var(--txt)}

.chartbox{position:relative;height:260px}.chartbox.sm{height:220px}
.empty{text-align:center;color:var(--faint);padding:38px 14px;font-size:13.5px;line-height:1.8}
.empty .ic{font-size:30px;margin-bottom:6px;opacity:.6}
.note{font-size:12px;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);padding:10px 13px;border-radius:10px;margin-top:12px;line-height:1.75}
.note.bad{border-inline-start-color:var(--down)}
.logbox{background:#05070a;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11.5px;color:var(--faint);max-height:280px;overflow-y:auto;line-height:1.85;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;z-index:200;font-size:13px;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.fade{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(4px)}}

.mnav{display:none}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}.preview{position:static}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}aside{display:none}
  main{padding:0 12px 92px}.top h1{font-size:18px}.kpi .v{font-size:21px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:rgba(11,15,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--faint);padding:4px 6px;border-radius:8px}
  .mnav button.on{color:var(--gold2)}.mnav svg{width:20px;height:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main>
    <div class="top">
      <div><h1 id="title">סקירה</h1><div class="sub" id="subtitle">מערכת איתותים חכמה · דמו</div></div>
      <span class="sp"></span>
      <span class="live"><span id="dot" class="dot"></span><span id="status">מאתחל…</span></span>
      <span class="live">סריקה הבאה <span class="timer" id="next">—</span></span>
      <button class="btn pri sm" onclick="scanNow()">סרוק עכשיו</button>
    </div>
    <div id="view" class="fade"></div>
  </main>
</div>
<nav class="mnav" id="mnav"></nav>
<div id="toastHost"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(this)">
<script>
/* ===================================================================
   CORE ENGINE — לוגיקה טהורה, בלי DOM ובלי רשת. נבדק ב-Node.
   =================================================================== */
(function (root) {
'use strict';

function ema(v, p) {
  if (!Array.isArray(v) || v.length < p || p < 1) return null;
  const k = 2 / (p + 1);
  let e = 0;
  for (let i = 0; i < p; i++) e += v[i];
  e /= p;
  for (let i = p; i < v.length; i++) e = v[i] * k + e * (1 - k);
  return Number.isFinite(e) ? e : null;
}

function sma(v, p) {
  if (!Array.isArray(v) || v.length < p || p < 1) return null;
  let s = 0;
  for (let i = v.length - p; i < v.length; i++) s += v[i];
  const r = s / p;
  return Number.isFinite(r) ? r : null;
}

function rsi(c, p) {
  p = p || 14;
  if (!Array.isArray(c) || c.length < p + 2) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = c[i] - c[i - 1]; if (d > 0) g += d; else l -= d; }
  let ag = g / p, al = l / p;
  for (let i = p + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    ag = (ag * (p - 1) + (d > 0 ? d : 0)) / p;
    al = (al * (p - 1) + (d < 0 ? -d : 0)) / p;
  }
  if (al === 0 && ag === 0) return 50;
  if (al === 0) return 100;
  if (ag === 0) return 0;
  const r = 100 - 100 / (1 + ag / al);
  return Number.isFinite(r) ? r : null;
}

function atr(h, l, c, p) {
  p = p || 14;
  if (!Array.isArray(c) || c.length < p + 2) return null;
  const tr = [];
  for (let i = 1; i < c.length; i++)
    tr.push(Math.max(h[i] - l[i], Math.abs(h[i] - c[i - 1]), Math.abs(l[i] - c[i - 1])));
  let a = 0;
  for (let i = 0; i < p; i++) a += tr[i];
  a /= p;
  for (let i = p; i < tr.length; i++) a = (a * (p - 1) + tr[i]) / p;
  return Number.isFinite(a) && a > 0 ? a : null;
}

function validBars(bars, min) {
  if (!Array.isArray(bars) || bars.length < (min || 210)) return false;
  for (const b of bars) {
    if (!b || ![b.t, b.o, b.h, b.l, b.c, b.v].every(Number.isFinite)) return false;
    if (b.h < b.l || b.c > b.h || b.c < b.l || b.o > b.h || b.o < b.l) return false;
    if (b.c <= 0) return false;
  }
  for (let i = 1; i < bars.length; i++) if (bars[i].t <= bars[i - 1].t) return false;
  return true;
}

// bars = נרות סגורים בלבד. livePrice = המחיר הנוכחי (הנר הפתוח), לכניסה ולבדיקת מתיחות.
function evaluate(bars, cfg, livePrice) {
  if (!validBars(bars, 210)) return { ok: false, reason: 'נתונים לא תקינים או חסרים' };
  const c = bars.map(b => b.c), h = bars.map(b => b.h),
        l = bars.map(b => b.l), v = bars.map(b => b.v);
  const price = Number.isFinite(livePrice) && livePrice > 0 ? livePrice : c[c.length - 1];
  const e20 = ema(c, 20), e50 = ema(c, 50), e200 = ema(c, 200);
  const r14 = rsi(c, 14), a14 = atr(h, l, c, 14), vAvg = sma(v, 20);
  if ([e20, e50, e200, r14, a14, vAvg].some(x => x === null))
    return { ok: false, reason: 'אינדיקטור לא חושב' };
  // מחיר חי שסוטה ביותר מ-3 ATR מהסגירה האחרונה = נתון חשוד
  if (Math.abs(price - c[c.length - 1]) > 3 * a14) return { ok: false, reason: 'מחיר חי חריג' };
  const atrPct = (a14 / price) * 100;
  if (atrPct > (cfg.maxAtrPct || 15)) return { ok: false, reason: 'תנודתיות קיצונית' };
  const ext = (price - e20) / a14;
  const conds = {
    'מגמה ראשית מעל EMA200': price > e200,
    'EMA20 מעל EMA50':        e20 > e50,
    'RSI בין 50 ל-68':        r14 >= 50 && r14 <= 68,
    'לא נמתח (עד 1.5 ATR)':   ext <= 1.5,
    'נפח מעל הממוצע':          v[v.length - 1] > vAvg,
  };
  const score = Object.values(conds).filter(Boolean).length;
  return { ok: true, price, e20, e50, e200, rsi: r14, atr: a14, atrPct, ext, conds, score,
           volRatio: v[v.length - 1] / vAvg, barTime: bars[bars.length - 1].t };
}

function buildTrade(sym, ev, cfg, equity, now) {
  const slipIn   = ev.price * ((cfg.slippagePct || 0) / 100);
  const entry    = ev.price + slipIn;
  const stopDist = cfg.atrStop * ev.atr;
  const stop     = entry - stopDist;
  const target   = entry + stopDist * cfg.rr;
  const riskUsd  = equity * (cfg.riskPct / 100);
  const qty      = riskUsd / stopDist;
  if (![entry, stop, target, qty, riskUsd].every(x => Number.isFinite(x) && x > 0)) return null;
  const beR = cfg.beAfterR ?? 0;
  const beTrigger = beR > 0 ? entry + stopDist * beR : null;
  return {
    id: 't' + now + '_' + sym,
    symbol: sym, direction: 'LONG',
    signalAt: now, barTime: ev.barTime,
    refPrice: ev.price, entry, stop, target, qty,
    stopDist, riskUsd, rewardUsd: riskUsd * cfg.rr,
    beTrigger, beArmedAt: null,
    atr: ev.atr, atrPct: ev.atrPct, rsi: ev.rsi,
    score: ev.score, conds: ev.conds, volRatio: ev.volRatio,
    status: 'open', exit: null, exitAt: null, exitReason: null,
    pnl: null, pnlPct: null, rMult: null, fees: null,
    livePrice: null, livePnl: null,
  };
}

function feesFor(t, exitPx, cfg) {
  return (t.entry * t.qty + exitPx * t.qty) * ((cfg.feePct || 0) / 100);
}

function settle(t, exitPx, exitAt, reason, cfg) {
  const fees  = feesFor(t, exitPx, cfg);
  const gross = (exitPx - t.entry) * t.qty;
  t.exit = exitPx; t.exitAt = exitAt; t.exitReason = reason;
  t.fees = fees;
  t.pnl  = gross - fees;
  t.rMult = (exitPx - t.entry) / t.stopDist;
  t.status = t.pnl >= 0 ? 'win' : 'loss';
  return t;
}

function resolve(t, bars, cfg) {
  if (!Array.isArray(bars) || !bars.length) return null;
  // רק נרות שנפתחו אחרי האיתות — נר שהתחיל לפני האיתות עלול להכיל מחיר שקדם לו
  const after = bars.filter(b => b.t >= t.signalAt);
  if (!after.length) return null;
  const slip = 1 - (cfg.slippagePct || 0) / 100;
  const beOn = (cfg.beAfterR ?? 0) > 0 && Number.isFinite(t.beTrigger);
  // נקודת האיחוד חלה רק על נרות שאחרי רגע ההפעלה — לא בדיעבד
  let armedAt = Number.isFinite(t.beArmedAt) ? t.beArmedAt : null;
  for (const b of after) {
    const stopNow = armedAt !== null && b.t > armedAt ? t.entry : t.stop;
    const isBE = stopNow === t.entry && armedAt !== null && b.t > armedAt;
    if (b.l <= stopNow)
      return { px: stopNow * slip, at: b.t, reason: isBE ? 'breakeven' : 'stop', beArmedAt: armedAt };
    if (b.h >= t.target)
      return { px: t.target, at: b.t, reason: 'target', beArmedAt: armedAt };
    if (beOn && armedAt === null && b.h >= t.beTrigger) armedAt = b.t;
  }
  const last = after[after.length - 1];
  return { open: true, last: last.c, lastT: last.t, beArmedAt: armedAt, beArmed: armedAt !== null,
           curStop: armedAt !== null ? t.entry : t.stop };
}

function equityOf(trades, startBalance) {
  let e = startBalance;
  for (const t of trades) if (t.status !== 'open' && Number.isFinite(t.pnl)) e += t.pnl;
  return e;
}

function summarize(trades, startBalance) {
  const done = trades.filter(t => t.status !== 'open');
  const wins = done.filter(t => t.status === 'win');
  const losses = done.filter(t => t.status === 'loss');
  const gw = wins.reduce((a, t) => a + t.pnl, 0);
  const gl = Math.abs(losses.reduce((a, t) => a + t.pnl, 0));
  const eq = equityOf(trades, startBalance);
  const rs = done.map(t => t.rMult).filter(Number.isFinite);
  return {
    total: done.length, wins: wins.length, losses: losses.length,
    winRate: done.length ? 100 * wins.length / done.length : null,
    grossWin: gw, grossLoss: gl,
    profitFactor: gl > 0 ? gw / gl : null,
    net: eq - startBalance, equity: eq,
    netPct: 100 * (eq - startBalance) / startBalance,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    totalFees: done.reduce((a, t) => a + (t.fees || 0), 0),
    open: trades.filter(t => t.status === 'open').length,
    breakevens: done.filter(t => t.exitReason === 'breakeven').length,
  };
}

const DEFAULT_CFG = {
  startBalance: 500, riskPct: 2, rr: 2, atrStop: 2.5, beAfterR: 1,
  minScore: 4, maxOpen: 5, scanMinutes: 10, interval: 'D',
  feePct: 0.055, slippagePct: 0.02, maxAtrPct: 15,
  symbols: ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT',
            'DOGEUSDT','AVAXUSDT','LINKUSDT','ADAUSDT','ARBUSDT'],
};

const API = { ema, sma, rsi, atr, validBars, evaluate, buildTrade,
              settle, resolve, feesFor, equityOf, summarize, DEFAULT_CFG };
if (typeof module !== 'undefined' && module.exports) module.exports = API;
root.CORE = API;
})(typeof globalThis !== 'undefined' ? globalThis : this);

async function getJSON(url, ms = 12000) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'פסק זמן' : e.message); }
  finally { clearTimeout(to); }
}

async function klines(sym, iv, limit) {
  const errs = [];
  const order = S.source ? [...SOURCES].sort((a, b) => (b.name === S.source) - (a.name === S.source)) : SOURCES;
  for (const src of order) {
    try {
      const bars = src.parse(await getJSON(src.url(sym, src.iv[iv] || src.iv['60'], limit)));
      if (S.source !== src.name) { S.source = src.name; logit('מקור נתונים פעיל: ' + src.name, 'sys'); }
      return bars;
    } catch (e) { errs.push(src.name + ': ' + e.message); }
  }
  throw new Error(errs.join(' | '));
}

async function scan() {

        // הנר האחרון עדיין פתוח: מחשבים על נרות סגורים, נכנסים במחיר החי

        const livePx = all.at(-1)?.c;

        notify(`🔔 איתות ${base(sym)} — ${ev.score}/5`, `כניסה ${nx(tr.entry)} · סטופ ${nx(tr.stop)} · יעד ${nx(tr.target)}`);

    const dead = syms.length && failed === syms.length;

async function monitor() {
  for (const t of S.trades.filter(t => t.status === 'open')) {

      const age = (Date.now() - t.signalAt) / 864e5;
      const iv = age > 35 ? '240' : age > 9 ? '60' : '15';
      const r = CORE.resolve(t, await klines(t.symbol, iv, 1000), S.cfg);
      if (!r) continue;
      if (!r.open) {

        t.beArmedAt = r.beArmedAt ?? t.beArmedAt;
        const win = t.status === 'win';
        logit(`${base(t.symbol)} נסגרה · ${REASON[r.reason]} · ${nx(r.px)} · ${usd(t.pnl)} (${t.rMult.toFixed(2)}R)`, win ? 'win' : 'loss');
        notify(`${win ? '✅' : '❌'} ${base(t.symbol)} — ${REASON[r.reason]}`, `${usd(t.pnl)} · ${t.rMult.toFixed(2)}R`);

      t.livePrice = r.last;
      t.livePnl = (r.last - t.entry) * t.qty - CORE.feesFor(t, r.last, S.cfg);
      if (age > (S.cfg.timeStopDays || 30)) {
        CORE.settle(t, r.last, Date.now(), 'time', S.cfg);
        logit(`${base(t.symbol)} נסגרה במגבלת ${S.cfg.timeStopDays} יום · ${usd(t.pnl)}`, t.pnl >= 0 ? 'win' : 'loss');
      }
    } catch (e) { logit(`ניטור ${t.symbol}: ${e.message}`, 'err'); }
  }
}

/* ---------------- רכיבים קטנים ---------------- */
function spark(vals, color) {
  if (!vals || vals.length < 2) return '';
  const w = 92, h = 30, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / r * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function eqSeries() { let r = S.cfg.startBalance; const out = [r];
  S.trades.filter(t => t.status !== 'open' && t.exitAt).sort((a, b) => a.exitAt - b.exitAt).forEach(t => out.push(r += t.pnl));
  return out; }
function badge(t) {
  if (t.status === 'open') return t.beArmedAt != null ? '<span class="badge b-s">🛡 מוגנת</span>' : '<span class="badge b-o">● פתוחה</span>';
  if (t.exitReason === 'breakeven') return '<span class="badge b-be">איחוד</span>';
  if (t.exitReason === 'time') return `<span class="badge ${t.status === 'win' ? 'b-w' : 'b-l'}">זמן</span>`;
  return t.status === 'win' ? '<span class="badge b-w">רווח</span>' : '<span class="badge b-l">הפסד</span>';
}
function rowCls(t) { return t.status === 'open' ? 'open' : t.exitReason === 'breakeven' ? 'be' : t.status; }
function track(t) {
  const lo = t.stop, hi = t.target, cur = fin(t.livePrice) ? t.livePrice : t.entry;
  const p = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100)), ep = p(t.entry);
  return `<div class="track" style="background:linear-gradient(90deg,rgba(239,68,68,.6),rgba(239,68,68,.12) ${ep}%,rgba(148,160,180,.25) ${ep}%,rgba(34,197,94,.12) ${ep + .5}%,rgba(34,197,94,.6))">
      <span class="en" style="left:${ep}%"></span><span class="mk" style="left:${p(cur)}%"></span></div>
    <div class="track-l num"><span class="down">${nx(t.beArmedAt != null ? t.entry : lo)}${t.beArmedAt != null ? ' 🛡' : ''}</span><span>${nx(t.entry)}</span><span class="up">${nx(hi)}</span></div>`;
}
function kpi(ic, k, v, vc, s, extra = '') {
  return `<div class="kpi"><div class="k"><i>${ic}</i>${k}</div><div class="v num ${vc || ''}">${v}</div>
    <div class="s">${s}</div>${extra}</div>`;
}

function jSet(kind, id, field, val) {
  const x = kind === 'trade' ? S.trades.find(t => t.id === id) : (S.notes || []).find(n => n.id === id);
  if (!x) return;
  if (field === 't') { const d = new Date(val).getTime(); if (!fin(d)) return toast('תאריך לא תקין', true); x.t = d; }
  else if (field === 'symbol') x.symbol = String(val).trim().toUpperCase();
  else x[field] = typeof val === 'string' ? val.slice(0, 500) : val;
  if (kind === 'trade') { x.edits = x.edits || {}; x.edits[field] = true; }
  save(); renderNav();
  const td = document.activeElement?.closest?.('td'); if (td && kind === 'trade') td.classList.add('edited');
  toast('נשמר ביומן');
}
function addNote() {
  S.notes = S.notes || [];

function chartOK() { if (!window.Chart) return false;
  Chart.defaults.color = '#94a0b4'; Chart.defaults.font.family = 'Heebo'; Chart.defaults.borderColor = 'rgba(255,255,255,.05)'; return true; }
function drawEquity(id, big) {
  const el = $(id); if (!el || !chartOK()) return;
  const d = S.trades.filter(t => t.status !== 'open' && t.exitAt).sort((a, b) => a.exitAt - b.exitAt);
  if (!d.length) return;
  let r = S.cfg.startBalance; const pts = [r], lbl = ['התחלה'];
  d.forEach(t => { pts.push(r += t.pnl); lbl.push(base(t.symbol) + ' · ' + new Date(t.exitAt).toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' })); });
  const good = r >= S.cfg.startBalance, col = good ? '#22c55e' : '#ef4444';
  const g = el.getContext('2d').createLinearGradient(0, 0, 0, big ? 260 : 260);
  g.addColorStop(0, good ? 'rgba(34,197,94,.28)' : 'rgba(239,68,68,.28)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  charts[id] = new Chart(el, { type: 'line',
    data: { labels: lbl, datasets: [
      { data: pts, borderColor: col, borderWidth: 2.2, fill: true, backgroundColor: g, tension: .3, pointRadius: d.length > 40 ? 0 : 2.5, pointBackgroundColor: col },
      { data: pts.map(() => S.cfg.startBalance), borderColor: 'rgba(232,184,90,.45)', borderDash: [5, 5], borderWidth: 1, pointRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { rtl: true, callbacks: { label: c => c.datasetIndex ? ' התחלה' : ' ' + usd(c.parsed.y) } } },
      scales: { x: { ticks: { maxTicksLimit: 6 }, grid: { display: false } }, y: { ticks: { callback: v => '$' + v } } } } });
}
function drawDonut() {
  const el = $('cvDonut'); if (!el || !chartOK()) return;
  const k = t => t.status === 'open' ? 3 : t.exitReason === 'breakeven' ? 2 : t.status === 'win' ? 0 : 1;
  const n = [0, 0, 0, 0]; S.trades.forEach(t => n[k(t)]++);
  charts.d = new Chart(el, { type: 'doughnut',
    data: { labels: ['רווח', 'הפסד', 'איחוד', 'פתוחות'], datasets: [{ data: n, borderWidth: 0,
      backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#60a5fa'], hoverOffset: 6 }] },
    options: { responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, padding: 14 } }, tooltip: { rtl: true } } } });
}
function drawRDist() {
  const el = $('cvR'); if (!el || !chartOK()) return;
  const rs = S.trades.filter(t => t.status !== 'open').map(t => t.rMult);
  const lbl = ['≤ −1', '−1…0', '0…1', '1…2', '≥ 2'], n = [0, 0, 0, 0, 0];
  rs.forEach(r => n[r <= -.99 ? 0 : r < 0 ? 1 : r < 1 ? 2 : r < 1.99 ? 3 : 4]++);
  charts.r = new Chart(el, { type: 'bar',
    data: { labels: lbl, datasets: [{ data: n, borderRadius: 6, backgroundColor: ['#ef4444', 'rgba(239,68,68,.45)', '#64748b', 'rgba(34,197,94,.5)', '#22c55e'] }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { display: false } }, y: { ticks: { precision: 0 } } } } });
}

      <button class="btn ghost sm" onclick="exportJson()">${I.dl} גיבוי</button>
      <button class="btn ghost sm" onclick="$('importFile').click()">שחזור מגיבוי</button>
      <button class="btn dz sm" onclick="resetAll()">איפוס מלא</button>
    </div>`;
  renderPreview();
}
function setD(k, v) {
  if (typeof v === 'number' && !Number.isFinite(v)) return;
  D[k] = v; if (PRESETS[D.preset] && PRESETS[D.preset].v[k] !== undefined && PRESETS[D.preset].v[k] !== v) D.preset = 'custom';
  const lab = $('v-' + k);
  if (lab) lab.textContent = k === 'startBalance' ? usd(v) : (k === 'feePct' || k === 'slippagePct') ? v + '%' : FMT[k] ? FMT[k](v) : v;
  renderPreview();
}
function applyPreset(k) { Object.assign(D, PRESETS[k].v, { preset: k }); renderSettingsBody(); toast('פרופיל ' + PRESETS[k].name + ' — לחץ שמור'); }
function renderPreview() {
  const el = $('setPrev'); if (!el || !D) return;
  const eq = CORE.equityOf(S.trades, D.startBalance), risk = eq * D.riskPct / 100;
  const atrP = ATR_GUESS[D.interval], stopP = atrP * D.atrStop, tgtP = stopP * D.rr;
  const need = 100 / (1 + D.rr), fee = D.feePct * 2 + D.slippagePct;
  const pos = risk / (stopP / 100);
  const ch = dirty();
  el.innerHTML = `<div class="card-h"><h2>תצוגה מקדימה</h2>${ch ? '<span class="badge b-be">לא נשמר</span>' : '<span class="badge b-w">שמור</span>'}</div>
    <div class="faint" style="font-size:11.5px;margin-bottom:8px">עסקה טיפוסית בהגדרות האלה (ATR משוער ${atrP}% ב${IV_NAME[D.interval]}):</div>
    <div class="pv-row"><span>סיכון לעסקה</span><b class="down">${usd(risk)}</b></div>
    <div class="pv-row"><span>רווח ביעד</span><b class="up">${usd(risk * D.rr)}</b></div>
    <div class="pv-row"><span>סטופ משוער</span><b>−${stopP.toFixed(1)}%</b></div>
    <div class="pv-row"><span>יעד משוער</span><b>+${tgtP.toFixed(1)}%</b></div>
    <div class="pv-row"><span>שווי פוזיציה</span><b>${usd(pos)}</b></div>
    <div class="pv-row"><span>הגנה מופעלת ב</span><b>${D.beAfterR ? '+' + (stopP * D.beAfterR).toFixed(1) + '%' : 'כבוי'}</b></div>
    <div class="pv-row"><span>חשיפה מקסימלית</span><b class="amber">${usd(risk * D.maxOpen)} (${(D.riskPct * D.maxOpen).toFixed(1)}%)</b></div>
    <div class="pv-row"><span>אחוז הצלחה לאיזון</span><b class="gold">${need.toFixed(1)}%</b></div>
    <div class="pv-row"><span>עלות עסקה (עמלות)</span><b>${fee.toFixed(3)}%</b></div>
    ${pos > eq ? `<div class="note bad">שווי הפוזיציה גדול מההון — בפועל זה דורש מינוף ×${(pos / eq).toFixed(1)}. הגדל את מרחק הסטופ או הורד סיכון.</div>` : ''}
    ${D.riskPct * D.maxOpen > 8 ? '<div class="note bad">חשיפה כוללת מעל 8% — רצף הפסדים אחד יכול לפגוע קשה בתיק.</div>' : ''}
    <div class="note">שינויים חלים על איתותים חדשים. עסקאות פתוחות ממשיכות ברמות שנקבעו להן.</div>`;
}
function addSym() {
  const el = $('newSym'); let v = (el.value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!v) return; if (!v.endsWith('USDT')) v += 'USDT';
  if (D.symbols.includes(v)) return toast('כבר ברשימה', true);
  D.symbols.push(v); renderSettingsBody(); toast(base(v) + ' נוסף — לחץ שמור');
}
function toggleSym(x) { D.paused = D.paused || [];
  D.paused = D.paused.includes(x) ? D.paused.filter(y => y !== x) : [...D.paused, x]; renderSettingsBody(); }
function rmSym(x) { D.symbols = D.symbols.filter(y => y !== x); D.paused = (D.paused || []).filter(y => y !== x); renderSettingsBody(); }
function saveSettings() {
  const num = ['startBalance', 'riskPct', 'rr', 'atrStop', 'minScore', 'maxOpen', 'scanMinutes', 'feePct', 'slippagePct', 'timeStopDays'];
  for (const k of num) if (!fin(D[k]) || D[k] < 0) return toast('ערך לא תקין: ' + k, true);
  if (D.startBalance < 10) return toast('הון התחלתי נמוך מדי', true);
  if (!D.symbols.length) return toast('רשימת המטבעות ריקה', true);
  const changedScan = D.scanMinutes !== S.cfg.scanMinutes;
  S.cfg = JSON.parse(JSON.stringify(D));
  if (changedScan) S.nextScan = Math.min(S.nextScan, Date.now() + S.cfg.scanMinutes * 6e4);
  logit('ההגדרות עודכנו', 'sys'); save(); toast('ההגדרות נשמרו'); render();
}
function resetAll() {
  if (!confirm('למחוק את כל העסקאות, היומן וההיסטוריה ולהתחיל מחדש?')) return;
  const cfg = S.cfg; S = { ...blank(), cfg }; D = JSON.parse(JSON.stringify(cfg));
  logit('המערכת אופסה', 'sys'); save(); toast('אופס'); render(); scanNow();
}

/* ================= מערכת ואבחון ================= */
function vSystem() {
  const d = S.diag; const q = LG.q.trim().toLowerCase();
  const K = { signal: ['איתות', 'b-gold'], win: ['רווח', 'b-w'], loss: ['הפסד', 'b-l'], shield: ['הגנה', 'b-s'],
              err: ['שגיאה', 'b-l'], warn: ['אזהרה', 'b-be'], skip: ['דילוג', 'b-g'], sys: ['מערכת', 'b-o'], info: ['מידע', 'b-g'] };
  const logs = S.log.filter(l => !q || l.m.toLowerCase().includes(q) || (K[l.k]?.[0] || '').includes(q));
  return `<div class="grid g2" style="align-items:start">
    <div class="card"><div class="card-h"><h2>אבחון חיבורים</h2><span class="c">${d ? stamp(d.at) : ''}</span>
      <span class="sp"></span><button class="btn ghost sm" onclick="runDiag()">בדוק שוב</button></div>
      ${d ? `<div class="tw" style="max-height:none"><table class="t"><thead><tr><th>רכיב</th><th>מצב</th><th>זמן</th><th>פרטים</th></tr></thead><tbody>
        ${d.sources.map(s => `<tr class="${s.ok ? 'win' : 'loss'}"><td>${s.name}</td><td>${s.ok ? '✅ מחובר' : '❌ נכשל'}</td><td class="num">${s.ms}ms</td><td class="dim">${esc(s.note)}</td></tr>`).join('')}
        <tr class="${d.engineOk ? 'win' : 'loss'}"><td>מנוע חישוב</td><td>${d.engineOk ? '✅ תקין' : '❌ תקלה'}</td><td>—</td><td class="dim">${esc(d.engineNote)}</td></tr>
        <tr class="${d.storeOk ? 'win' : 'loss'}"><td>אחסון</td><td>${d.storeOk ? '✅ פעיל' : '❌ חסום'}</td><td>—</td><td class="dim">${d.storeOk ? 'הנתונים נשמרים בדפדפן' : 'הנתונים לא יישמרו'}</td></tr>
      </tbody></table></div>
      ${!d.anySource ? `<div class="note bad"><b>אף מקור נתונים לא נגיש.</b> אם פתחת את הקובץ בדאבל-קליק — העלה אותו ל-Netlify. אחרת, ייתכן שהרשת חוסמת בורסות.</div>`
        : `<div class="note">מחובר דרך <b>${esc(S.source || '')}</b>. אם המקור נופל, המערכת עוברת לבא בתור אוטומטית.</div>`}`
      : '<div class="empty">טרם בוצע אבחון</div>'}</div>
    <div class="card"><div class="card-h"><h2>מצב</h2></div>
      <div class="pv-row"><span>סריקה אחרונה</span><b>${stamp(S.lastScan)}</b></div>
      <div class="pv-row"><span>מטבעות פעילים</span><b>${activeSyms().length} / ${S.cfg.symbols.length}</b></div>
      <div class="pv-row"><span>מסגרת / יחס</span><b>${IV_NAME[S.cfg.interval]} · 1:${S.cfg.rr}</b></div>
      <div class="pv-row"><span>רשומות ביומן מערכת</span><b>${S.log.length}</b></div>
      <div class="pv-row"><span>נפח אחסון</span><b>${(JSON.stringify(S).length / 1024).toFixed(0)} KB</b></div>
      <div class="note">המערכת רצה רק כשהדף פתוח. בכל פתיחה היא משחזרת אוטומטית מה קרה לעסקאות הפתוחות בזמן שהיה סגור — אבל איתותים חדשים נוצרים רק כשהיא פתוחה.</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>יומן מערכת</h2><span class="c">${S.log.length} רשומות</span><span class="sp"></span>
    <div class="search" style="max-width:240px">${I.search}<input placeholder="סינון…" value="${esc(LG.q)}" oninput="LG.q=this.value;clearTimeout(window._lq);window._lq=setTimeout(()=>{render();const e=document.querySelectorAll('.search input');e[e.length-1].focus()},250)"></div>
    <button class="btn ghost sm" onclick="if(confirm('לנקות את יומן המערכת?')){S.log=[];save();render()}">נקה</button></div>
    ${logs.length ? `<div class="tw"><table class="t"><thead><tr><th>זמן</th><th>סוג</th><th>אירוע</th></tr></thead><tbody>
      ${logs.slice(0, 300).map(l => `<tr><td class="faint">${stamp(l.t)}</td><td><span class="badge ${K[l.k]?.[1] || 'b-g'}">${K[l.k]?.[0] || l.k}</span></td><td>${esc(l.m)}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">אין רשומות</div>'}</div>`;
}
async function runDiag() { setStatus('מאבחן…', 'live'); await diagnose(); setStatus(S.diag.anySource ? 'פעיל' : 'אין חיבור', S.diag.anySource ? 'live' : 'err'); render(); toast('האבחון הושלם'); }

/* ================= ייצוא / ייבוא ================= */
function csv(rows) { return '﻿' + rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'); }
function exportCsv() {
  const H = ['מצב', 'מטבע', 'תאריך איתות', 'ניקוד', 'כניסה', 'סטופ', 'נק׳ הגנה', 'יעד', 'כמות', 'סיכון $', 'יציאה', 'תאריך יציאה', 'סיבה', 'עמלות', 'רווח/הפסד $', '% מהתיק', 'R'];
  const st = t => t.status === 'open' ? 'פתוחה' : t.exitReason === 'breakeven' ? 'איחוד' : t.status === 'win' ? 'רווח' : 'הפסד';
  dl(new Blob([csv([H, ...S.trades.map(t => [st(t), t.symbol, stamp(t.signalAt), t.score + '/5', t.entry, t.stop, t.beTrigger ?? '', t.target, t.qty,
    t.riskUsd?.toFixed(2), t.exit ?? '', t.exitAt ? stamp(t.exitAt) : '', REASON[t.exitReason] || '', t.fees?.toFixed(3) ?? '',
    t.pnl?.toFixed(2) ?? '', fin(t.pnl) ? (t.pnl / S.cfg.startBalance * 100).toFixed(2) + '%' : '', t.rMult?.toFixed(2) ?? ''])])],
    { type: 'text/csv;charset=utf-8' }), 'signal-pro-trades.csv');
}
function exportJournal() {
  const H = ['תאריך', 'סוג', 'מטבע', 'תוצאה', 'R', 'רווח/הפסד $', 'ההחלטה שלי', 'דירוג', 'תגיות', 'הערה', 'לקח'];
  dl(new Blob([csv([H, ...jRows().map(r => { const x = r.ref;
    return r.kind === 'note' ? [stamp(x.t), 'הערה', x.symbol, '', '', '', x.decision, x.rating || '', x.tags, x.note, x.lesson]
      : [stamp(x.signalAt), 'עסקה', x.symbol, x.status === 'open' ? 'פתוחה' : REASON[x.exitReason], x.rMult?.toFixed(2) ?? '',
         x.pnl?.toFixed(2) ?? '', x.decision, x.rating || '', x.tags, x.note, x.lesson]; })])],
    { type: 'text/csv;charset=utf-8' }), 'signal-pro-journal.csv');
}
function exportJson() { dl(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), `signal-pro-backup-${new Date().toISOString().slice(0, 10)}.json`); }
function importJson(inp) {
  const f = inp.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result);
      if (!Array.isArray(d.trades) || !d.cfg) throw new Error('קובץ לא תקין');
      if (!confirm(`לשחזר ${d.trades.length} עסקאות? המצב הנוכחי יוחלף.`)) return;
      S = { ...blank(), ...d, cfg: { ...CORE.DEFAULT_CFG, ...EXTRA, ...d.cfg } }; D = JSON.parse(JSON.stringify(S.cfg));
      save(); render(); toast('שוחזר בהצלחה'); }
    catch (e) { toast('השחזור נכשל: ' + e.message, true); } finally { inp.value = ''; } };
  r.readAsText(f);
}
function dl(b, n) { const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = n; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); toast('הקובץ ירד'); }

/* ================= לולאה ================= */
function countdown() { const ms = S.nextScan - Date.now(); const el = $('next'); if (!el) return;
  if (busy) { el.textContent = 'סורק…'; return; }
  el.textContent = ms <= 0 ? 'עכשיו' : `${Math.floor(ms / 6e4)}:${String(Math.floor(ms % 6e4 / 1e3)).padStart(2, '0')}`; }
function scanNow() { S.nextScan = Date.now(); scan(); }

async function boot() {
  render(); logit('המערכת הופעלה', 'sys'); setStatus('בודק חיבור…', '');
  const d = await diagnose();
  if (!d.anySource) { setStatus('אין חיבור לנתונים', 'err'); view = 'system'; logit('אף מקור נתונים לא נגיש', 'err'); save(); render(); }
  else { logit(`אבחון: ${d.sources.filter(x => x.ok).length}/3 מקורות · מנוע ${d.engineOk ? 'תקין' : 'תקול'}`, 'sys'); await scan(); }
  clearInterval(tickT); clearInterval(loopT);
  tickT = setInterval(countdown, 1000);
  loopT = setInterval(() => { if (Date.now() >= S.nextScan) scan(); }, 15000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() >= S.nextScan) scan(); });
window.addEventListener('beforeunload', e => { if (view === 'settings' && dirty()) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('error', e => { logit('שגיאת ממשק: ' + e.message, 'err'); });
window.addEventListener('load', boot);

</script>
</body>
</html>
