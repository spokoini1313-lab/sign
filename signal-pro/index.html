<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Signal Pro — מערכת איתותים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
:root{
  --bg:#07090d; --bg2:#0b0f16; --card:#0f141d; --card2:#141b27; --card3:#1a2232;
  --line:rgba(255,255,255,.06); --line2:rgba(255,255,255,.1);
  --txt:#eef2f8; --dim:#94a0b4; --faint:#5e6a7e;
  --gold:#e8b85a; --gold2:#f5d48e; --teal:#2dd4bf; --blue:#60a5fa;
  --up:#22c55e; --upbg:rgba(34,197,94,.09); --upln:rgba(34,197,94,.28);
  --down:#ef4444; --downbg:rgba(239,68,68,.09); --downln:rgba(239,68,68,.28);
  --amber:#f59e0b; --amberbg:rgba(245,158,11,.1);
  --r:14px; --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:14.5px;line-height:1.55;
  background:
    radial-gradient(1100px 600px at 100% -10%,rgba(232,184,90,.07),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(45,212,191,.05),transparent 60%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--txt);background:var(--bg2);
  border:1px solid var(--line2);border-radius:9px;padding:9px 11px;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,90,.12)}
label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:500}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#222b3a;border-radius:8px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-inline-end:1px solid var(--line);
  background:linear-gradient(180deg,rgba(15,20,29,.85),rgba(7,9,13,.85));backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#1a1204;
  background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(232,184,90,.3)}
.logo b{font-size:16px;letter-spacing:.2px}.logo small{display:block;font-size:10.5px;color:var(--faint);margin-top:-2px}
.nav-i{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--dim);font-size:14px;font-weight:500;transition:all .15s;width:100%;text-align:right}
.nav-i:hover{background:var(--card2);color:var(--txt)}
.nav-i.on{background:linear-gradient(90deg,rgba(232,184,90,.14),rgba(232,184,90,.03));color:var(--gold2);box-shadow:inset -2px 0 0 var(--gold)}
.nav-i svg{width:18px;height:18px;flex-shrink:0}
.nav-i .cnt{margin-inline-start:auto;font-size:10.5px;background:var(--card3);color:var(--dim);padding:1px 7px;border-radius:999px}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.side-foot .row{display:flex;justify-content:space-between;margin:3px 0}

main{min-width:0;padding:0 26px 40px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 0 14px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--bg) 70%,transparent)}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.2px}
.top .sub{font-size:12px;color:var(--faint)}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--up);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 2s infinite}
.dot.err{background:var(--down)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.timer{font-variant-numeric:tabular-nums;color:var(--gold2);font-weight:600}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204;box-shadow:0 6px 18px rgba(232,184,90,.22)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,184,90,.32)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--txt)}
.btn.ghost:hover{background:var(--card3)}
.btn.dz{background:var(--downbg);border:1px solid var(--downln);color:#fca5a5}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.ic{padding:6px 8px}
.btn svg{width:15px;height:15px}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--card),rgba(15,20,29,.7));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 40%)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:600}
.card-h .c{font-size:11.5px;color:var(--faint)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.6fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi .k{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);font-weight:500}
.kpi .k i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-size:12px;background:var(--card3)}
.kpi .v{font-size:25px;font-weight:700;margin-top:8px;letter-spacing:-.4px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:4px}
.kpi .spark{position:absolute;inset-inline-start:10px;bottom:10px;opacity:.9}
.bar{height:6px;border-radius:6px;background:var(--card3);overflow:hidden;margin-top:9px}
.bar>span{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.up{color:var(--up)}.down{color:var(--down)}.amber{color:var(--amber)}.dim{color:var(--dim)}.faint{color:var(--faint)}.gold{color:var(--gold2)}

/* ---------- positions ---------- */
.pos{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.pos-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pos-h b{font-size:15px}
.track{position:relative;height:8px;border-radius:8px;margin:14px 0 6px;
  background:linear-gradient(90deg,rgba(239,68,68,.55),rgba(239,68,68,.15) 33%,rgba(148,160,180,.18) 33.5%,rgba(34,197,94,.15) 34%,rgba(34,197,94,.55))}
.track .mk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(50%,-50%);background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 2px 8px rgba(0,0,0,.5)}
.track .en{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--dim);transform:translateX(50%)}
.track-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:620px;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;font-variant-numeric:tabular-nums}
.t th{position:sticky;top:0;z-index:2;background:#111723;text-align:right;color:var(--dim);font-weight:600;font-size:11px;
  padding:10px 11px;border-bottom:1px solid var(--line2);white-space:nowrap;letter-spacing:.2px}
.t td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tbody tr{transition:background .12s}
.t tbody tr:hover td{background:rgba(255,255,255,.025)}
.t tr.win td{background:var(--upbg)} .t tr.win td:first-child{box-shadow:inset -3px 0 0 var(--up)}
.t tr.loss td{background:var(--downbg)} .t tr.loss td:first-child{box-shadow:inset -3px 0 0 var(--down)}
.t tr.be td{background:var(--amberbg)} .t tr.be td:first-child{box-shadow:inset -3px 0 0 var(--amber)}
.t tr.open td:first-child{box-shadow:inset -3px 0 0 var(--blue)}
.t input,.t select{padding:6px 8px;font-size:12.5px;border-radius:7px;background:transparent;border-color:transparent;min-width:70px}
.t input:hover,.t select:hover{border-color:var(--line2);background:var(--bg2)}
.t input:focus,.t select:focus{background:var(--bg2)}
.t .note-in{min-width:220px}
.t td.edited{position:relative}
.t td.edited::after{content:"✎";position:absolute;top:3px;inset-inline-start:4px;font-size:9px;color:var(--gold)}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:.2px}
.b-w{background:rgba(34,197,94,.16);color:#86efac}.b-l{background:rgba(239,68,68,.16);color:#fca5a5}
.b-o{background:rgba(96,165,250,.15);color:#93c5fd}.b-be{background:rgba(245,158,11,.16);color:#fcd34d}
.b-s{background:rgba(45,212,191,.14);color:#5eead4}.b-g{background:var(--card3);color:var(--dim)}
.b-gold{background:rgba(232,184,90,.15);color:var(--gold2)}

/* ---------- chips / toolbar ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--dim);font-weight:500}
.chip.on{background:rgba(232,184,90,.13);border-color:rgba(232,184,90,.4);color:var(--gold2)}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{padding-inline-start:34px}
.search svg{position:absolute;top:50%;inset-inline-start:11px;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}

/* ---------- settings ---------- */
.set-sec{margin-bottom:22px}
.set-sec h3{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:8px}
.set-sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.sl{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.sl-h label{margin:0}.sl-h b{font-size:15px;color:var(--gold2);font-variant-numeric:tabular-nums}
.sl small{display:block;font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.5}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;padding:0;border:none;border-radius:5px;background:var(--card3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));cursor:pointer;box-shadow:0 2px 8px rgba(232,184,90,.4)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--gold);cursor:pointer}
input[type=range]:focus{box-shadow:none}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:6px}
.preset{text-align:right;padding:13px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:all .15s}
.preset:hover{border-color:var(--line2);background:var(--card2)}
.preset.on{border-color:rgba(232,184,90,.5);background:rgba(232,184,90,.07)}
.preset b{display:block;font-size:13.5px;margin-bottom:3px}.preset span{font-size:11px;color:var(--faint)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;background:var(--bg2);border:1px solid var(--line);border-radius:11px}
.tog div{font-size:13px}.tog small{display:block;font-size:11px;color:var(--faint)}
.sw{position:relative;width:40px;height:22px;border-radius:22px;background:var(--card3);flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#cbd5e1;transition:all .2s}
.sw.on{background:linear-gradient(135deg,var(--gold2),var(--gold))}.sw.on::after{right:21px;background:#1a1204}
.preview{position:sticky;top:84px}
.pv-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pv-row:last-child{border:none}.pv-row b{font-variant-numeric:tabular-nums}
.symchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sym{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 11px;border-radius:9px;background:var(--bg2);border:1px solid var(--line2);font-size:12.5px;font-weight:600}
.sym.off{opacity:.45;text-decoration:line-through}
.sym button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--faint);font-size:12px}
.sym button:hover{background:var(--card3);color:var(--txt)}

.t td.why{white-space:normal;min-width:190px;max-width:260px}
.whyb{text-align:right;font-size:12px;color:var(--dim);line-height:1.5;padding:4px 6px;border-radius:7px;width:100%}
.whyb:hover{background:var(--card3);color:var(--txt)}
.t tr.whyrow td{background:var(--bg2)!important;box-shadow:none!important;white-space:normal;padding:0}
.whyp{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:16px 18px;border-top:1px dashed var(--line2)}
.whyp h4{font-size:13px;color:var(--gold2);margin-bottom:8px}.whyp h5{font-size:11.5px;color:var(--dim);margin:12px 0 6px;font-weight:500}
.whyp ul{list-style:none;display:grid;gap:6px;font-size:12.5px;line-height:1.6}
.whyp li{padding-inline-start:16px;position:relative}.whyp li::before{content:"•";position:absolute;inset-inline-start:2px;color:var(--faint)}
.whyp .chk li.y::before{content:"✓";color:var(--up)}.whyp .chk li.n::before{content:"✗";color:var(--down)}
@media(max-width:760px){.whyp{grid-template-columns:1fr;gap:12px}}
.opcard .opsum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:4px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.opcard .big{font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1}
.opcard .opsum .faint{font-size:12px;line-height:1.7}
.opr{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:9px;cursor:pointer;font-size:13px}
.opr:hover{background:var(--card2)}.opr>b:first-child{min-width:54px}
.opbar{flex:1;height:8px;border-radius:8px;background:var(--card3);position:relative;overflow:hidden;direction:ltr}
.opbar::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.opbar span{position:absolute;top:0;bottom:0;border-radius:8px}
.opbar span.p{left:50%;background:linear-gradient(90deg,rgba(34,197,94,.45),var(--up))}
.opbar span.n{right:50%;background:linear-gradient(270deg,rgba(239,68,68,.45),var(--down))}
.oplive{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:12.5px;cursor:pointer}
@media(max-width:760px){.opcard .big{font-size:28px}.opr{gap:8px}}
.chartbox{position:relative;height:260px}.chartbox.sm{height:220px}
.empty{text-align:center;color:var(--faint);padding:38px 14px;font-size:13.5px;line-height:1.8}
.empty .ic{font-size:30px;margin-bottom:6px;opacity:.6}
.note{font-size:12px;color:var(--dim);background:var(--bg2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);padding:10px 13px;border-radius:10px;margin-top:12px;line-height:1.75}
.note.bad{border-inline-start-color:var(--down)}
.logbox{background:#05070a;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11.5px;color:var(--faint);max-height:280px;overflow-y:auto;line-height:1.85;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:11px 18px;border-radius:12px;z-index:200;font-size:13px;box-shadow:var(--shadow);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.fade{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(4px)}}

.mnav{display:none}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}.preview{position:static}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}aside{display:none}
  main{padding:0 12px 92px}.top h1{font-size:18px}.kpi .v{font-size:21px}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;justify-content:space-around;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));background:rgba(11,15,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--faint);padding:4px 6px;border-radius:8px}
  .mnav button.on{color:var(--gold2)}.mnav svg{width:20px;height:20px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main>
    <div class="top">
      <div><h1 id="title">סקירה</h1><div class="sub" id="subtitle">מערכת איתותים חכמה · דמו</div></div>
      <span class="sp"></span>
      <span class="live"><span id="dot" class="dot"></span><span id="status">מאתחל…</span></span>
      <span class="live">סריקה הבאה <span class="timer" id="next">—</span></span>
      <button class="btn pri sm" onclick="scanNow()">סרוק עכשיו</button>
    </div>
    <div id="view" class="fade"></div>
  </main>
</div>
<nav class="mnav" id="mnav"></nav>
<div id="toastHost"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJson(this)">
<script>
/* ===================================================================
   CORE ENGINE — לוגיקה טהורה, בלי DOM ובלי רשת. נבדק ב-Node.
   =================================================================== */
(function (root) {
'use strict';

function ema(v, p) {
  if (!Array.isArray(v) || v.length < p || p < 1) return null;
  const k = 2 / (p + 1);
  let e = 0;
  for (let i = 0; i < p; i++) e += v[i];
  e /= p;
  for (let i = p; i < v.length; i++) e = v[i] * k + e * (1 - k);
  return Number.isFinite(e) ? e : null;
}

function sma(v, p) {
  if (!Array.isArray(v) || v.length < p || p < 1) return null;
  let s = 0;
  for (let i = v.length - p; i < v.length; i++) s += v[i];
  const r = s / p;
  return Number.isFinite(r) ? r : null;
}

function rsi(c, p) {
  p = p || 14;
  if (!Array.isArray(c) || c.length < p + 2) return null;
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) { const d = c[i] - c[i - 1]; if (d > 0) g += d; else l -= d; }
  let ag = g / p, al = l / p;
  for (let i = p + 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    ag = (ag * (p - 1) + (d > 0 ? d : 0)) / p;
    al = (al * (p - 1) + (d < 0 ? -d : 0)) / p;
  }

function atr(h, l, c, p) {

  const tr = [];

  let a = 0;
  for (let i = 0; i < p; i++) a += tr[i];

  return Number.isFinite(a) && a > 0 ? a : null;
}

function validBars(bars, min) {
  if (!Array.isArray(bars) || bars.length < (min || 210)) return false;
  for (const b of bars) {
    if (!b || ![b.t, b.o, b.h, b.l, b.c, b.v].every(Number.isFinite)) return false;
    if (b.h < b.l || b.c > b.h || b.c < b.l || b.o > b.h || b.o < b.l) return false;
    if (b.c <= 0) return false;
  }
  for (let i = 1; i < bars.length; i++) if (bars[i].t <= bars[i - 1].t) return false;
  return true;

// bars = נרות סגורים בלבד. livePrice = המחיר הנוכחי (הנר הפתוח), לכניסה ולבדיקת מתיחות.
function evaluate(bars, cfg, livePrice) {
  if (!validBars(bars, 210)) return { ok: false, reason: 'נתונים לא תקינים או חסרים' };
  const c = bars.map(b => b.c), h = bars.map(b => b.h),
        l = bars.map(b => b.l), v = bars.map(b => b.v);
  const price = Number.isFinite(livePrice) && livePrice > 0 ? livePrice : c[c.length - 1];
  const e20 = ema(c, 20), e50 = ema(c, 50), e200 = ema(c, 200);
  const r14 = rsi(c, 14), a14 = atr(h, l, c, 14), vAvg = sma(v, 20);
  if ([e20, e50, e200, r14, a14, vAvg].some(x => x === null))
    return { ok: false, reason: 'אינדיקטור לא חושב' };
  // מחיר חי שסוטה ביותר מ-3 ATR מהסגירה האחרונה = נתון חשוד
  if (Math.abs(price - c[c.length - 1]) > 3 * a14) return { ok: false, reason: 'מחיר חי חריג' };
  const atrPct = (a14 / price) * 100;
  if (atrPct > (cfg.maxAtrPct || 15)) return { ok: false, reason: 'תנודתיות קיצונית' };

    'EMA20 מעל EMA50':        e20 > e50,
    'RSI בין 50 ל-68':        r14 >= 50 && r14 <= 68,
    'לא נמתח (עד 1.5 ATR)':   ext <= 1.5,

function buildTrade(sym, ev, cfg, equity, now) {

}

  return (t.entry * t.qty + exitPx * t.qty) * ((cfg.feePct || 0) / 100);
}

  const after = bars.filter(b => b.t >= t.signalAt);
  if (!after.length) return null;
  const slip = 1 - (cfg.slippagePct || 0) / 100;
  const beOn = (cfg.beAfterR ?? 0) > 0 && Number.isFinite(t.beTrigger);
  // נקודת האיחוד חלה רק על נרות שאחרי רגע ההפעלה — לא בדיעבד

    const stopNow = armedAt !== null && b.t > armedAt ? t.entry : t.stop;
    const isBE = stopNow === t.entry && armedAt !== null && b.t > armedAt;
    if (b.l <= stopNow)

    if (b.h >= t.target)
      return { px: t.target, at: b.t, reason: 'target', beArmedAt: armedAt };
    if (beOn && armedAt === null && b.h >= t.beTrigger) armedAt = b.t;

  return e;

function summarize(trades, startBalance) {
  const done = trades.filter(t => t.status !== 'open');
  const wins = done.filter(t => t.status === 'win');
  const losses = done.filter(t => t.status === 'loss');
  const gw = wins.reduce((a, t) => a + t.pnl, 0);
  const gl = Math.abs(losses.reduce((a, t) => a + t.pnl, 0));
  const eq = equityOf(trades, startBalance);
  const rs = done.map(t => t.rMult).filter(Number.isFinite);
  return {
    total: done.length, wins: wins.length, losses: losses.length,
    winRate: done.length ? 100 * wins.length / done.length : null,
    grossWin: gw, grossLoss: gl,
    profitFactor: gl > 0 ? gw / gl : null,
    net: eq - startBalance, equity: eq,
    netPct: 100 * (eq - startBalance) / startBalance,
    avgR: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null,
    totalFees: done.reduce((a, t) => a + (t.fees || 0), 0),
    open: trades.filter(t => t.status === 'open').length,

  minScore: 4, maxOpen: 5, scanMinutes: 10, interval: 'D',

            'DOGEUSDT','AVAXUSDT','LINKUSDT','ADAUSDT','ARBUSDT'],

      if (p.last <= p.stop) r.push('המחיר כבר מתחת לסטופ');

  e.style.color = bad ? '#fca5a5' : '#86efac'; e.textContent = m;
  $('toastHost').appendChild(e); setTimeout(() => e.remove(), 2800);
}
function logit(m, k = 'info') { S.log.unshift({ t: Date.now(), k, m }); if (S.log.length > 600) S.log.length = 600; }
function setStatus(t, k) { $('status').textContent = t; $('dot').className = 'dot ' + (k || ''); }

function beep(up = true) {
  if (!S.cfg.sound) return;
  try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const a = new A(), o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(up ? 660 : 330, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(up ? 990 : 220, a.currentTime + .18);
    g.gain.setValueAtTime(.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(.18, a.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .35);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .36);
  } catch (e) {}
}
function notify(title, body) {
  try { if (S.cfg.notify && 'Notification' in window && Notification.permission === 'granted')
    new Notification(title, { body, tag: title }); } catch (e) {}
}
async function askNotify() {
  if (!('Notification' in window)) return toast('הדפדפן לא תומך בהתראות', true);
  const p = await Notification.requestPermission();
  if (p === 'granted') { D && (D.notify = true); toast('התראות הופעלו'); notify('Signal Pro', 'ההתראות פעילות'); }
  else toast('ההרשאה נדחתה בדפדפן', true);
  if (view === 'settings') renderSettingsBody();
}

    parse: j => { const L = j?.result?.list; if (!Array.isArray(L) || !L.length) throw new Error(j?.retMsg || 'ריק');

    parse: j => { const L = j?.data; if (!Array.isArray(L) || !L.length) throw new Error(j?.msg || 'ריק');

async function getJSON(url, ms = 12000) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'פסק זמן' : e.message); }
  finally { clearTimeout(to); }
}

async function klines(sym, iv, limit) {
  const errs = [];
  const order = S.source ? [...SOURCES].sort((a, b) => (b.name === S.source) - (a.name === S.source)) : SOURCES;
  for (const src of order) {
    try {
      const bars = src.parse(await getJSON(src.url(sym, src.iv[iv] || src.iv['60'], limit)));
      if (S.source !== src.name) { S.source = src.name; logit('מקור נתונים פעיל: ' + src.name, 'sys'); }
      return bars;
    } catch (e) { errs.push(src.name + ': ' + e.message); }
  }
  throw new Error(errs.join(' | '));
}

/* ================= אבחון עצמי ================= */
async function diagnose() {
  const res = [];
  for (const src of SOURCES) {
    const t0 = performance.now();
    try { const b = src.parse(await getJSON(src.url('BTCUSDT', src.iv['60'], 5), 10000));
      res.push({ name: src.name, ok: true, ms: Math.round(performance.now() - t0), note: `BTC ${nx(b.at(-1).c, 2)}` }); }
    catch (e) { res.push({ name: src.name, ok: false, ms: Math.round(performance.now() - t0), note: e.message }); }
  }
  let engineOk = true, engineNote = '';
  try {
    const bars = []; let p = 100; const t = Date.now() - 300 * 36e5;
    for (let i = 0; i < 300; i++) { p *= 1 + .002 + Math.sin(i / 7) * .01;
      bars.push({ t: t + i * 36e5, o: p * .999, h: p * 1.01, l: p * .99, c: p, v: 1000 + i }); }
    const ev = CORE.evaluate(bars, S.cfg);
    const tr = ev.ok && CORE.buildTrade('TEST', ev, S.cfg, 500, Date.now());
    if (!tr) { engineOk = false; engineNote = ev.reason || 'בניית עסקה נכשלה'; }
    else { const w = CORE.settle({ ...tr }, tr.target, Date.now(), 'target', S.cfg);
      engineOk = Math.abs(w.rMult - S.cfg.rr) < 1e-6;
      engineNote = engineOk ? `R=${w.rMult.toFixed(2)} · עמלה ${usd(w.fees)}` : 'R שגוי ' + w.rMult; }
  } catch (e) { engineOk = false; engineNote = e.message; }
  let storeOk = true; try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storeOk = false; }
  S.diag = { at: Date.now(), sources: res, engineOk, engineNote, storeOk, anySource: res.some(r => r.ok) };
  save(); return S.diag;
}

async function scan() {
  if (busy) return; busy = true;
  setStatus('סורק את השוק…', 'live');
  const C = S.cfg; let found = 0, checked = 0, failed = 0;
  const syms = activeSyms();
  try {
    await monitor();
    if (LK.key) { try { await liveSync(); } catch (e) {} }
    for (const sym of syms) {
      const live = S.trades.filter(t => t.status === 'open');
      if (live.length >= C.maxOpen) { logit(`התיק מלא (${C.maxOpen} פוזיציות) — הסריקה נעצרה`, 'warn'); break; }
      if (live.some(t => t.symbol === sym)) continue;
      try {
        const all = await klines(sym, C.interval, 301);
        checked++;
        // הנר האחרון עדיין פתוח: מחשבים על נרות סגורים, נכנסים במחיר החי
        const lastOpen = all.length && Date.now() - all.at(-1).t < (IV_MS[C.interval] || 36e5);
        const closed = lastOpen ? all.slice(0, -1) : all;
        const livePx = all.at(-1)?.c;
        const ev = CORE.evaluate(closed, C, livePx);
        if (!ev.ok) { logit(`${sym}: ${ev.reason}`, 'skip'); continue; }
        if (ev.score < C.minScore) continue;
        const tr = CORE.buildTrade(sym, ev, C, CORE.equityOf(S.trades, C.startBalance), Date.now());
        if (!tr) { logit(`${sym}: רמות לא תקינות`, 'skip'); continue; }
        Object.assign(tr, { decision: '', rating: 0, tags: '', note: '', lesson: '', edits: {}, interval: C.interval,
          ind: { e20: ev.e20, e50: ev.e50, e200: ev.e200, ext: ev.ext, price: ev.price },
          rules: { atrStop: C.atrStop, rr: C.rr, riskPct: C.riskPct, beAfterR: C.beAfterR, timeStopDays: C.timeStopDays } });
        S.trades.unshift(tr); found++;
        logit(`איתות ${base(sym)} ${ev.score}/5 · כניסה ${nx(tr.entry)} · סטופ ${nx(tr.stop)} · יעד ${nx(tr.target)}`, 'signal');
        notify(`🔔 איתות ${base(sym)} — ${ev.score}/5`, `כניסה ${nx(tr.entry)} · סטופ ${nx(tr.stop)} · יעד ${nx(tr.target)}` +
          (L().enabled ? ' · פתח "מסחר אמיתי" לביצוע' : ''));
        beep(true);
      } catch (e) { failed++; logit(`${sym}: ${e.message}`, 'err'); }
    }
    S.lastScan = Date.now(); S.nextScan = Date.now() + C.scanMinutes * 6e4;
    logit(found ? `סריקה הושלמה · ${found} איתותים חדשים · ${checked} נבדקו${failed ? ' · ' + failed + ' נכשלו' : ''}`
                : `סריקה הושלמה · אין היתכנות · ${checked} נבדקו${failed ? ' · ' + failed + ' נכשלו' : ''}`, 'sys');
    const dead = syms.length && failed === syms.length;
    setStatus(dead ? 'אין חיבור לנתונים' : `פעיל · ${S.source || ''}`, dead ? 'err' : 'live');
  } catch (e) {
    logit('שגיאת סריקה: ' + e.message, 'err'); setStatus('שגיאה', 'err'); S.nextScan = Date.now() + 6e4;
  } finally { busy = false; save(); render(); }
}

async function monitor() {
  for (const t of S.trades.filter(t => t.status === 'open')) {
    try {
      const age = (Date.now() - t.signalAt) / 864e5;
      const iv = age > 160 ? 'D' : age > 38 ? '240' : age > 9 ? '60' : '15';
      const r = CORE.resolve(t, await klines(t.symbol, iv, 1000), S.cfg);
      if (!r) continue;
      if (!r.open) {
        CORE.settle(t, r.px, r.at, r.reason, S.cfg);
        t.beArmedAt = r.beArmedAt ?? t.beArmedAt;
        const win = t.status === 'win';
        logit(`${base(t.symbol)} נסגרה · ${REASON[r.reason]} · ${nx(r.px)} · ${usd(t.pnl)} (${t.rMult.toFixed(2)}R)`, win ? 'win' : 'loss');
        notify(`${win ? '✅' : '❌'} ${base(t.symbol)} — ${REASON[r.reason]}`, `${usd(t.pnl)} · ${t.rMult.toFixed(2)}R`);
        beep(win);
        continue;
      }
      if (r.beArmedAt != null && t.beArmedAt == null) {
        t.beArmedAt = r.beArmedAt;
        logit(`${base(t.symbol)} עברה 1R — הסטופ הוזז לכניסה ${nx(t.entry)}. מכאן היא מוגנת`, 'shield');
        notify(`🛡 ${base(t.symbol)} מוגנת`, 'הסטופ הוזז לנקודת הכניסה');
      }
      t.livePrice = r.last; t.liveAt = Date.now();
      t.livePnl = (r.last - t.entry) * t.qty - CORE.feesFor(t, r.last, S.cfg);
    } catch (e) { logit(`ניטור ${t.symbol}: ${e.message}`, 'err'); }
  }
}

/* ---------------- רכיבים קטנים ---------------- */
function spark(vals, color) {
  if (!vals || vals.length < 2) return '';
  const w = 92, h = 30, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / r * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function eqSeries() { let r = S.cfg.startBalance; const out = [r];
  S.trades.filter(t => t.status !== 'open' && t.exitAt).sort((a, b) => a.exitAt - b.exitAt).forEach(t => out.push(r += t.pnl));
  return out; }
function badge(t) {
  if (t.status === 'open') return t.beArmedAt != null ? '<span class="badge b-s">🛡 מוגנת</span>' : '<span class="badge b-o">● פתוחה</span>';
  if (t.exitReason === 'breakeven') return '<span class="badge b-be">איחוד</span>';
  if (t.exitReason === 'manual') return `<span class="badge ${t.status === 'win' ? 'b-w' : 'b-l'}">ידני</span>`;
  if (t.exitReason === 'time') return `<span class="badge ${t.status === 'win' ? 'b-w' : 'b-l'}">זמן</span>`;
  return t.status === 'win' ? '<span class="badge b-w">רווח</span>' : '<span class="badge b-l">הפסד</span>';
}
function rowCls(t) { return t.status === 'open' ? 'open' : t.exitReason === 'breakeven' ? 'be' : t.status; }
function track(t) {
  const lo = t.stop, hi = t.target, cur = fin(t.livePrice) ? t.livePrice : t.entry;
  const p = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100)), ep = p(t.entry);
  return `<div class="track" style="background:linear-gradient(90deg,rgba(239,68,68,.6),rgba(239,68,68,.12) ${ep}%,rgba(148,160,180,.25) ${ep}%,rgba(34,197,94,.12) ${ep + .5}%,rgba(34,197,94,.6))">
      <span class="en" style="left:${ep}%"></span><span class="mk" style="left:${p(cur)}%"></span></div>
    <div class="track-l num"><span class="down">${nx(t.beArmedAt != null ? t.entry : lo)}${t.beArmedAt != null ? ' 🛡' : ''}</span><span>${nx(t.entry)}</span><span class="up">${nx(hi)}</span></div>`;
}
function kpi(ic, k, v, vc, s, extra = '') {
  return `<div class="kpi"><div class="k"><i>${ic}</i>${k}</div><div class="v num ${vc || ''}">${v}</div>
    <div class="s">${s}</div>${extra}</div>`;
}

/* ---------------- רווח/הפסד פתוח עכשיו ---------------- */
function openPnl() {
  const list = S.trades.filter(t => t.status === 'open');
  const priced = list.filter(t => fin(t.livePnl));
  const sum = priced.reduce((a, t) => a + t.livePnl, 0);
  const lastAt = Math.max(0, ...list.map(t => t.liveAt || 0));
  const lv = (S.live?.orders || []).filter(o => o.status === 'open');
  return { list, n: list.length, priced: priced.length, sum, up: priced.filter(t => t.livePnl > 0).length,
           down: priced.filter(t => t.livePnl < 0).length, lastAt, liveN: lv.length, liveSum: lv.reduce((a, o) => a + (fin(o.upnl) ? o.upnl : 0), 0) };
}
function openCard(op) {
  if (!op.n && !op.liveN) return '';
  const max = Math.max(1e-9, ...op.list.map(t => Math.abs(t.livePnl || 0)));
  const rows = [...op.list].sort((a, b) => (b.livePnl ?? -1e9) - (a.livePnl ?? -1e9)).map(t => {
    const v = t.livePnl, mv = fin(t.livePrice) ? (t.livePrice - t.entry) / t.entry * 100 : null, w = fin(v) ? Math.abs(v) / max * 50 : 0;
    return `<div class="opr" onclick="go('trades')">
      <b>${esc(base(t.symbol))}</b>${t.beArmedAt != null ? ' <span title="מוגנת">🛡</span>' : ''}
      <div class="opbar"><span class="${v >= 0 ? 'p' : 'n'}" style="width:${w}%"></span></div>
      <span class="num faint" style="min-width:58px;text-align:left">${fin(mv) ? pct(mv) : '—'}</span>
      <b class="num ${cls(v)}" style="min-width:74px;text-align:left">${fin(v) ? usd(v) : '—'}</b></div>`; }).join('');
  return `<div class="card opcard"><div class="card-h"><h2>רווח / הפסד פתוח עכשיו</h2>
      <span class="c">${op.n} פוזיציות${op.lastAt ? ' · מחירים ' + ago(op.lastAt) : ''}</span><span class="sp"></span>
      <button class="btn ghost sm" onclick="refreshOpen(true)" ${RO.busy ? 'disabled' : ''}>${RO.busy ? 'מעדכן…' : 'רענן מחירים'}</button></div>
    <div class="opsum"><div class="big num ${cls(op.sum)}">${op.priced ? (op.sum > 0 ? '+' : '') + usd(op.sum) : '—'}</div>
      <div class="faint">${op.priced ? `${pct(op.sum / S.cfg.startBalance * 100)} מההון · <span class="up">${op.up} ברווח</span> · <span class="down">${op.down} בהפסד</span>` : 'ממתין למחיר ראשון'}
        <br>לא ממומש — משתנה עם המחיר. נכלל בשווי התיק רק כשהעסקה נסגרת.</div></div>
    ${rows}
    ${op.liveN ? `<div class="oplive" onclick="go('live')">⚡ במסחר אמיתי (Bybit): ${op.liveN} פתוחות · <b class="num ${cls(op.liveSum)}">${usd(op.liveSum)}</b></div>` : ''}
  </div>`;
}
// רענון מחירים לפוזיציות פתוחות — כל דקה, בלי לחכות לסריקה
const RO = { busy: false };
async function refreshOpen(manual) {
  if (RO.busy || busy || document.hidden && !manual) return;
  const list = S.trades.filter(t => t.status === 'open'); if (!list.length) return;
  RO.busy = true; if (manual && view === 'overview') render();
  try {
    await Promise.all(list.map(async t => {
      try { const b = await klines(t.symbol, '15', 2); const px = b.at(-1)?.c;
        if (fin(px) && px > 0 && t.status === 'open') { t.livePrice = px; t.livePnl = (px - t.entry) * t.qty - CORE.feesFor(t, px, S.cfg); t.liveAt = Date.now(); } }
      catch (e) {}
    }));
    save();
  } finally { RO.busy = false; if (view === 'overview' || manual) render(); else renderNav(); }
}

/* ================= סגירה ידנית של עסקת דמו ================= */
const CL = {};   // מצב כפתור הסגירה: לחיצה ראשונה = אישור, שנייה = סגירה
function closeBtn(t) {
  const st = CL[t.id];
  return `<button class="btn ${st === 'confirm' ? 'dz' : 'ghost'} sm" ${st === 'busy' ? 'disabled' : ''} onclick="closeDemo('${esc(t.id)}')">${
    st === 'confirm' ? 'לחץ שוב לסגירה' : st === 'busy' ? 'סוגר…' : 'סגור'}</button>`;
}
async function closeDemo(id) {
  const t = S.trades.find(x => x.id === id); if (!t || t.status !== 'open') return;
  if (CL[id] !== 'confirm') { CL[id] = 'confirm'; render(); setTimeout(() => { if (CL[id] === 'confirm') { delete CL[id]; render(); } }, 6000); return; }
  CL[id] = 'busy'; render();
  try {
    const bars = await klines(t.symbol, '15', 3);
    const px = bars.at(-1)?.c;
    if (!fin(px) || px <= 0) throw new Error('אין מחיר עדכני');
    if (t.status !== 'open') throw new Error('העסקה כבר נסגרה');
    CORE.settle(t, px * (1 - (S.cfg.slippagePct || 0) / 100), Date.now(), 'manual', S.cfg);
    logit(`${base(t.symbol)} נסגרה ידנית ב-${nx(t.exit)} · ${usd(t.pnl)} (${t.rMult.toFixed(2)}R)`, t.pnl >= 0 ? 'win' : 'loss');
    toast(`${base(t.symbol)} נסגרה · ${usd(t.pnl)}`);
    const lo = (S.live?.orders || []).find(o => o.tradeId === id && (o.status === 'open' || o.status === 'pending'));
    if (lo) toast('שים לב: הפוזיציה האמיתית ב-Bybit עדיין פתוחה. סגור אותה בלשונית "מסחר אמיתי"', true);
    save();
  } catch (e) { toast('הסגירה נכשלה: ' + e.message, true); }
  finally { delete CL[id]; render(); }
}

/* ================= נימוקי כניסה ויציאה ================= */
const pctOf = (a, b) => (a - b) / b * 100;
const days = ms => ms / 864e5;
const durTxt = ms => { const d = days(ms); return d >= 1 ? `${d.toFixed(1)} ימים` : `${Math.max(1, Math.round(ms / 36e5))} שעות`; };
function whyEntry(t) {
  const c = t.conds || {}, i = t.ind || {};
  const lines = [];
  const has = k => Object.keys(c).find(x => x.includes(k));
  const L = (k, okTxt, badTxt) => { const key = has(k); if (!key) return; lines.push({ ok: !!c[key], txt: c[key] ? okTxt : badTxt }); };
  L('EMA200', fin(i.e200) ? `מגמה ראשית עולה: המחיר ${nx(i.price ?? t.refPrice)} מעל ממוצע 200 (${nx(i.e200)}), ${pctOf(i.price ?? t.refPrice, i.e200).toFixed(1)}% מעליו`
                          : 'מגמה ראשית עולה: המחיר מעל ממוצע 200',
                          fin(i.e200) ? `המחיר מתחת לממוצע 200 (${nx(i.e200)}) — אין מגמה ראשית עולה` : 'המחיר מתחת לממוצע 200');
  L('EMA20 מעל', fin(i.e20) ? `מבנה מגמה תקין: ממוצע 20 (${nx(i.e20)}) מעל ממוצע 50 (${nx(i.e50)})` : 'מבנה מגמה תקין: ממוצע 20 מעל ממוצע 50',
                 'ממוצע 20 מתחת לממוצע 50 — המגמה הקצרה נחלשת');
  L('RSI', `מומנטום בריא: RSI ${fin(t.rsi) ? t.rsi.toFixed(1) : '—'}, בטווח 50–68 — חזק, אבל לא קנוי-יתר`,
           `RSI ${fin(t.rsi) ? t.rsi.toFixed(1) : '—'} מחוץ לטווח 50–68`);
  L('נמתח', fin(i.ext) ? `לא רודפים: המחיר רק ${i.ext.toFixed(2)} ATR מעל ממוצע 20 (מותר עד 1.5)` : 'לא רודפים: המחיר קרוב לממוצע 20',
            fin(i.ext) ? `המחיר נמתח ${i.ext.toFixed(2)} ATR מעל ממוצע 20 — כניסה מאוחרת` : 'המחיר נמתח מדי מעל ממוצע 20');
  L('נפח', `נפח המסחר ${fin(t.volRatio) ? t.volRatio.toFixed(2) + '×' : ''} מהממוצע — יש השתתפות אמיתית`,
           `נפח המסחר רק ${fin(t.volRatio) ? t.volRatio.toFixed(2) + '×' : ''} מהממוצע — השתתפות חלשה`);
  const stopPct = pctOf(t.stop, t.entry), tgtPct = pctOf(t.target, t.entry);
  const rr = (t.target - t.entry) / (t.entry - t.stop);
  const atrMult = fin(t.atr) && t.atr > 0 ? (t.entry - t.stop) / t.atr : null;
  const plan = [
    `כניסה ב-${nx(t.entry)} (מחיר השוק ${nx(t.refPrice)} + סליפג׳)`,
    `סטופ ב-${nx(t.stop)} (${stopPct.toFixed(1)}%)${atrMult ? ` — ${atrMult.toFixed(2)}×ATR מתחת לכניסה, כדי לא להיפגע מתנודה רגילה` : ''}`,
    `יעד ב-${nx(t.target)} (+${tgtPct.toFixed(1)}%) — יחס 1:${+rr.toFixed(2)}`,
    `גודל פוזיציה ${nx(t.qty, 5)} יח׳ (${usd(t.entry * t.qty)}) — מחושב כך שפגיעה בסטופ תעלה ${usd(t.riskUsd)} בלבד`,
  ];
  if (fin(t.beTrigger)) plan.push(`הגנה: אם המחיר יגיע ל-${nx(t.beTrigger)} (+${pctOf(t.beTrigger, t.entry).toFixed(1)}%), הסטופ יזוז לכניסה`);
  const passed = lines.filter(l => l.ok).length;
  const short = `${t.score ?? passed}/5 תנאים · ${lines.filter(l => l.ok).map(l => l.txt.split(':')[0].split(' —')[0]).slice(0, 2).join(' · ')}${lines.some(l => !l.ok) ? ' · חסר: ' + lines.filter(l => !l.ok).map(l => l.txt.split(' —')[0].split(':')[0]).join(', ') : ''}`;
  return { lines, plan, short };
}
function whyExit(t) {
  const fmtR = fin(t.rMult) ? `${t.rMult >= 0 ? '+' : ''}${t.rMult.toFixed(2)}R` : '';
  if (t.status === 'open') {
    const cur = t.livePrice;
    const prog = fin(cur) ? Math.max(-100, Math.min(100, (cur - t.entry) / (t.target - t.entry) * 100)) : null;
    const lines = [
      `העסקה עדיין פתוחה ${durTxt(Date.now() - t.signalAt)}. לא נגעה ביעד (${nx(t.target)}) ולא בסטופ (${nx(t.beArmedAt != null ? t.entry : t.stop)}).`,
      fin(cur) ? `מחיר אחרון ${nx(cur)} (${pctOf(cur, t.entry) >= 0 ? '+' : ''}${pctOf(cur, t.entry).toFixed(2)}% מהכניסה) — ${prog >= 0 ? `${prog.toFixed(0)}% מהדרך ליעד` : `${Math.abs(pctOf(cur, t.entry) / pctOf(t.stop, t.entry) * 100).toFixed(0)}% מהדרך לסטופ`}.` : 'עדיין אין מחיר עדכני.',
    ];
    if (t.beArmedAt != null) lines.push(`ב-${stamp(t.beArmedAt)} המחיר עבר 1R והסטופ הוזז לכניסה. מכאן העסקה לא יכולה להפסיד מעבר לעמלות.`);
    const lim = t.rules?.timeStopDays ?? S.cfg.timeStopDays;
    if (lim) lines.push(`אם לא תיסגר עד ${stamp(t.signalAt + lim * 864e5)} (${lim} יום), תיסגר במחיר השוק.`);
    return { lines, short: fin(cur) ? `פתוחה · ${prog >= 0 ? prog.toFixed(0) + '% ליעד' : 'מתחת לכניסה'}${t.beArmedAt != null ? ' · מוגנת' : ''}` : 'פתוחה' };
  }
  const held = durTxt(t.exitAt - t.signalAt), when = stamp(t.exitAt), feeTxt = fin(t.fees) ? ` (אחרי עמלות ${usd(t.fees)})` : '';
  const R = t.exitReason, lines = [];
  if (R === 'target') {
    lines.push(`המחיר עלה והגיע ליעד ${nx(t.target)} ב-${when}, ${held} אחרי הכניסה.`);
    lines.push(`העסקה נסגרה כמתוכנן ברווח ${usd(t.pnl)}${feeTxt} — ${fmtR}, בדיוק היחס שתוכנן בכניסה.`);
    if (t.beArmedAt != null) lines.push(`בדרך, ב-${stamp(t.beArmedAt)}, הסטופ הוזז לכניסה, כך שמאותו רגע לא היה סיכון.`);
  } else if (R === 'stop') {
    lines.push(`המחיר ירד אל הסטופ ${nx(t.stop)} ב-${when}, ${held} אחרי הכניסה, לפני שהגיע ליעד.`);
    lines.push(`ההפסד נעצר ב-${usd(t.pnl)}${feeTxt} — ${fmtR}. זה הסיכון שהוגדר מראש; הסטופ עשה את תפקידו.`);
    lines.push(fin(t.beTrigger) ? `הסטופ לא הוזז לכניסה כי המחיר לא הגיע ל-${nx(t.beTrigger)} (1R) לפני הירידה.`
                                : 'בגרסה שבה נפתחה העסקה עוד לא הייתה הגנת נקודת איחוד, ולכן הסטופ נשאר במקומו.');
  } else if (R === 'breakeven') {
    lines.push(`ב-${stamp(t.beArmedAt)} המחיר עלה ל-${nx(t.beTrigger)} (1R) והמערכת הזיזה את הסטופ למחיר הכניסה.`);
    lines.push(`אחר כך המחיר חזר לכניסה ${nx(t.entry)} ב-${when} והעסקה נסגרה.`);
    lines.push(`תוצאה ${usd(t.pnl)} — רק העמלות. בלי ההגנה זו הייתה יכולה להיות עסקה מפסידה.`);
  } else if (R === 'time') {
    const lim = t.rules?.timeStopDays ?? 30;
    lines.push(`עברו ${held} בלי שהמחיר הגיע ליעד (${nx(t.target)}) או לסטופ (${nx(t.stop)}).`);
    lines.push(`העסקה נסגרה במגבלת הזמן (${lim} יום) במחיר השוק ${nx(t.exit)} — ${t.pnl >= 0 ? 'ברווח' : 'בהפסד'} ${usd(t.pnl)} (${fmtR}).`);
    lines.push('המטרה: לא להחזיק כסף תקוע בעסקה שלא זזה.');
    if (days(t.exitAt - t.signalAt) > lim + 1) lines.push(`⚠ הסגירה בוצעה ${(days(t.exitAt - t.signalAt) - lim).toFixed(1)} ימים אחרי המגבלה, כי בגרסה הקודמת הבדיקה רצה רק כשהדף נפתח. המחיר הוא של יום הסגירה בפועל.`);
  } else if (R === 'manual') {
    lines.push(`סגרת את העסקה ידנית ב-${when}, ${held} אחרי הכניסה, במחיר השוק ${nx(t.exit)}.`);
    lines.push(`באותו רגע היא לא הגיעה ליעד (${nx(t.target)}) ולא לסטופ (${nx(t.beArmedAt != null ? t.entry : t.stop)}). התוצאה ${usd(t.pnl)} (${fmtR}) אחרי עמלות.`);
    lines.push('העסקה נספרת בסטטיסטיקה. בלשונית הביצועים אפשר לראות אם סגירות ידניות עוזרות או מזיקות.');
  } else lines.push(`נסגרה ב-${nx(t.exit)} ב-${when} · ${usd(t.pnl)}`);
  const short = { target: `הגיעה ליעד אחרי ${held}`, stop: `נפגע סטופ אחרי ${held}`, breakeven: 'חזרה לכניסה אחרי הגנה', time: `מגבלת זמן · ${held}`, manual: `נסגרה ידנית אחרי ${held}` }[R] || '—';
  return { lines, short };
}

function jSet(kind, id, field, val) {
  const x = kind === 'trade' ? S.trades.find(t => t.id === id) : (S.notes || []).find(n => n.id === id);

  else if (field === 'symbol') x.symbol = String(val).trim().toUpperCase();

  const td = document.activeElement?.closest?.('td'); if (td && kind === 'trade') td.classList.add('edited');

    const p = LIVECORE.plan({ last, stop: t.stop, target: t.target, equity: eq, riskPct: lv.riskPct, maxExposure: lv.maxExposure, inst });
    LV.prep = { tradeId, state: 'ready', last, inst, plan: p, blocks: g.concat(p.ok ? [] : [p.reason]), eq, at: Date.now() };
  } catch (e) { LV.prep = { tradeId, state: 'error', msg: e.message }; }

}
async function liveExecute() {
  const lv = L(), P = LV.prep; if (!P || P.state !== 'ready' || P.blocks.length || BB.busy) return;
  if (Date.now() - P.at > 60000) { toast('ההכנה ישנה מדקה — מחשב מחדש'); return livePrepare(P.tradeId); }
  const t = S.trades.find(x => x.id === P.tradeId);
  if (lv.orders.some(o => o.tradeId === t.id)) return toast('כבר נשלחה פקודה לאיתות הזה', true);
  BB.busy = true;
  const linkId = ('sp' + t.id.replace(/[^A-Za-z0-9]/g, '')).slice(0, 36);
  const o = { tradeId: t.id, symbol: t.symbol, linkId, env: lv.env, status: 'pending', at: Date.now(), qty: P.plan.qty,
    planEntry: P.last, sl: P.plan.sl, tp: P.plan.tp, riskUsd: P.plan.riskUsd, notional: P.plan.notional, beDone: false,
    beAfterR: S.cfg.beAfterR };
  lv.orders.unshift(o); save();                      // נשמר לפני השליחה — מונע כפילות גם אם הדף נסגר באמצע
  LV.prep = { ...P, state: 'sending' }; renderLiveSafe();
  try {
    try { await bbPrivate('POST', '/v5/position/set-leverage', { category: 'linear', symbol: t.symbol,
      buyLeverage: String(lv.leverage), sellLeverage: String(lv.leverage) }); }
    catch (e) { if (e.code !== 110043) throw e; }
    const r = await bbPrivate('POST', '/v5/order/create', { category: 'linear', symbol: t.symbol, side: 'Buy', orderType: 'Market',
      qty: P.plan.qtyStr, positionIdx: 0, orderLinkId: linkId, takeProfit: P.plan.tpStr, stopLoss: P.plan.slStr,
      tpslMode: 'Full', tpTriggerBy: 'LastPrice', slTriggerBy: 'LastPrice' });
    o.orderId = r.orderId; o.status = 'open';
    logit(`🟢 פקודה אמיתית נשלחה: קנייה ${P.plan.qtyStr} ${base(t.symbol)} · סטופ ${P.plan.slStr} · יעד ${P.plan.tpStr}`, 'signal');
    toast('הפקודה נשלחה ל-Bybit'); LV.prep = null;
    save(); await liveSync();
  } catch (e) {
    o.status = 'failed'; o.err = e.message; logit(`פקודה ל-${base(t.symbol)} נכשלה: ${e.message}`, 'err');
    toast('הפקודה נכשלה: ' + e.message, true); LV.prep = { ...P, state: 'failed', msg: e.message };
    save();
  } finally { BB.busy = false; renderLiveSafe(); }
}
async function liveClose(linkId) {
  const o = L().orders.find(x => x.linkId === linkId); if (!o || o.status !== 'open') return;
  if (!LV.closing[linkId]) { LV.closing[linkId] = 'confirm'; renderLiveSafe(); return; }
  LV.closing[linkId] = 'sending'; renderLiveSafe();
  try {
    await bbPrivate('POST', '/v5/order/create', { category: 'linear', symbol: o.symbol, side: 'Sell', orderType: 'Market',
      qty: '0', reduceOnly: true, closeOnTrigger: true, positionIdx: 0 });
    o.manualClose = true; logit(`סגירה ידנית של ${base(o.symbol)} נשלחה`, 'sys'); toast('פקודת סגירה נשלחה');
    await liveSync();
  } catch (e) { toast('הסגירה נכשלה: ' + e.message, true); logit('סגירה נכשלה: ' + e.message, 'err'); }
  finally { delete LV.closing[linkId]; renderLiveSafe(); }
}

async function liveCloseAll() {
  const list = L().orders.filter(o => o.status === 'open');
  if (!list.length) return;
  if (LV.closeAll !== 'confirm') { LV.closeAll = 'confirm'; renderLiveSafe();
    setTimeout(() => { if (LV.closeAll === 'confirm') { LV.closeAll = null; renderLiveSafe(); } }, 6000); return; }
  LV.closeAll = 'busy'; renderLiveSafe();
  const failed = [];
  for (const o of list) {
    try { await bbPrivate('POST', '/v5/order/create', { category: 'linear', symbol: o.symbol, side: 'Sell', orderType: 'Market',
        qty: '0', reduceOnly: true, closeOnTrigger: true, positionIdx: 0 }); o.manualClose = true; }
    catch (e) { failed.push(base(o.symbol) + ': ' + e.message); }
  }
  logit(`סגירת כל הפוזיציות האמיתיות נשלחה (${list.length - failed.length}/${list.length})`, failed.length ? 'err' : 'sys');
  toast(failed.length ? 'חלק מהסגירות נכשלו: ' + failed.join(' · ') : 'כל הפוזיציות נסגרו', !!failed.length);
  LV.closeAll = null; await liveSync();

/* ---------- סנכרון: מילוי, הגנה, סגירה ---------- */
let liveTimer = null;
async function liveSync() {
  if (!LK.key) return;
  const lv = L();
  for (const o of lv.orders.filter(o => (o.status === 'open' || o.status === 'pending') && o.env === lv.env)) {
    try {
      const pos = await bbPrivate('GET', '/v5/position/list', { category: 'linear', symbol: o.symbol });
      const p = (pos?.list || []).find(x => +x.size > 0 && (x.side === 'Buy' || x.side === ''));
      if (p) {
        if (o.status === 'pending') o.status = 'open';
        o.fill = +p.avgPrice || o.fill; o.size = +p.size; o.mark = +p.markPrice || o.mark;
        o.upnl = +p.unrealisedPnl; o.exSl = +p.stopLoss || o.exSl; o.exTp = +p.takeProfit || o.exTp; o.syncAt = Date.now();
        if (LIVECORE.shouldBreakeven(o, o.mark, o.beAfterR)) {
          const inst = await instrument(o.symbol);
          const be = LIVECORE.roundStep(o.fill, inst.tick, 'up');
          await bbPrivate('POST', '/v5/position/trading-stop', { category: 'linear', symbol: o.symbol, positionIdx: 0,
            tpslMode: 'Full', stopLoss: LIVECORE.fmtStep(be, inst.tick), slTriggerBy: 'LastPrice' });
          o.beDone = true; o.sl = be; o.beAt = Date.now();
          logit(`🛡 ${base(o.symbol)} (אמיתי): הסטופ בבורסה הוזז לכניסה ${LIVECORE.fmtStep(be, inst.tick)}`, 'shield');
          notify(`🛡 ${base(o.symbol)} מוגנת`, 'הסטופ בבורסה הוזז לנקודת הכניסה');
        }
      } else if (o.status === 'open' || (o.status === 'pending' && Date.now() - o.at > 60000)) {
        const cp = await bbPrivate('GET', '/v5/position/closed-pnl', { category: 'linear', symbol: o.symbol, startTime: String(o.at - 6e4), limit: '50' });
        const recs = (cp?.list || []).filter(x => +x.createdTime >= o.at - 6e4 || +x.updatedTime >= o.at);
        if (recs.length) {
          o.pnl = recs.reduce((a, x) => a + (+x.closedPnl || 0), 0);
          o.exit = +recs[0].avgExitPrice; o.fill = o.fill || +recs[0].avgEntryPrice;
          o.closedAt = Math.max(...recs.map(x => +x.updatedTime || 0)) || Date.now(); o.status = 'closed';
          const near = (a, b) => Math.abs(a - b) / b < 0.003;
          o.reason = o.manualClose ? 'ידני' : near(o.exit, o.tp) ? 'יעד' : o.beDone && near(o.exit, o.sl) ? 'נקודת איחוד' : near(o.exit, o.sl) ? 'סטופ' : 'אחר';
          logit(`${o.pnl >= 0 ? '✅' : '❌'} עסקה אמיתית ${base(o.symbol)} נסגרה (${o.reason}) · ${usd(o.pnl)}`, o.pnl >= 0 ? 'win' : 'loss');
          notify(`${o.pnl >= 0 ? '✅' : '❌'} ${base(o.symbol)} — עסקה אמיתית נסגרה`, `${o.reason} · ${usd(o.pnl)}`);
          beep(o.pnl >= 0);
        } else if (o.status === 'pending') { o.status = 'failed'; o.err = 'הפקודה לא בוצעה בבורסה'; }
      }
    } catch (e) { o.syncErr = e.message; logit(`סנכרון ${base(o.symbol)}: ${e.message}`, 'err'); }
  }
  try { BB.wallet = await walletUSDT(); } catch (e) {}
  checkLock(); save(); renderLiveSafe();
  clearTimeout(liveTimer);
  if (liveOpen().length) liveTimer = setTimeout(liveSync, 60000);   // בזמן שיש פוזיציה אמיתית — כל דקה
}

/* ---------- הגדרות ---------- */
function liveSet(k, v) {
  const lv = L();
  if (k === 'env') {
    if (v === 'mainnet' && !lv.mainnetAck) { LV.askMainnet = true; renderLiveSafe(); return; }
    if (liveOpen().length) return toast('אי אפשר להחליף סביבה כשיש פוזיציה פתוחה', true);
    lv.env = v; liveLock(); BB.inst = {}; logit('סביבת המסחר: ' + (v === 'mainnet' ? 'כסף אמיתי' : 'testnet'), 'sys');
  } else if (k === 'enabled') {
    if (v && BB.conn?.state !== 'ok') return toast('קודם חבר מפתח תקין', true);
    lv.enabled = v; logit('מסחר אמיתי ' + (v ? 'הופעל' : 'כובה'), 'sys');
  } else {
    if (!fin(v) || v <= 0) return toast('ערך לא תקין', true);
    const caps = { alloc: [10, 100000], riskPct: [.25, 3], maxPositions: [1, 5], maxLossPct: [5, 50], maxSlipPct: [.2, 3], maxAgeH: [1, 48] };
    if (caps[k]) v = Math.max(caps[k][0], Math.min(caps[k][1], v));
    lv[k] = v;
  }
  save(); renderLiveSafe();
}
function liveConfirmMainnet() {
  if (($('lk-mainnet')?.value || '').trim() !== 'כסף אמיתי') return toast('הקלד בדיוק: כסף אמיתי', true);
  L().mainnetAck = true; LV.askMainnet = false; liveSet('env', 'mainnet');
}
function liveUnlockLoss() {
  if (!LV.confirmUnlock) { LV.confirmUnlock = true; renderLiveSafe(); return; }
  LV.confirmUnlock = false; L().locked = null; L().lockResetAt = Date.now(); L().alloc = Math.max(10, L().alloc + liveRealized());
  logit('נעילת ההפסד שוחררה ידנית. ההקצאה עודכנה ליתרה שנשארה', 'warn'); save(); renderLiveSafe();
}

            <button class="btn pri sm" onclick="livePrepare('${esc(t.id)}')">בצע בלייב</button></div>
            <div class="faint" style="font-size:12px">כניסה ${nx(t.entry)} · סטופ ${nx(t.stop)} · יעד ${nx(t.target)}</div></div>`).join('')
        : `<div class="empty">אין כרגע איתות פתוח שגילו פחות מ-${lv.maxAgeH} שעות.<br>כשיגיע איתות חדש, תקבל התראה וכפתור ביצוע.</div>`}
      </div>
      <div class="card"><div class="card-h"><h2>פוזיציות אמיתיות</h2>${opn.filter(o => o.status === 'open').length > 1 ? `<span class="sp"></span>
        <button class="btn dz sm" onclick="liveCloseAll()" ${LV.closeAll === 'busy' ? 'disabled' : ''}>${LV.closeAll === 'confirm' ? 'לחץ שוב לסגירת הכל' : LV.closeAll === 'busy' ? 'סוגר…' : 'סגור הכל'}</button>` : ''}</div>
        ${opn.length ? opn.map(o => `<div class="pos"><div class="pos-h"><b>${esc(base(o.symbol))}</b>
            ${o.beDone ? '<span class="badge b-s">🛡 מוגנת</span>' : `<span class="badge b-o">${o.status === 'pending' ? 'ממתינה' : 'פתוחה'}</span>`}
            <span class="badge ${o.env === 'mainnet' ? 'b-l' : 'b-g'}">${o.env === 'mainnet' ? 'אמיתי' : 'testnet'}</span><span class="sp"></span>
            <b class="num ${cls(o.upnl)}">${fin(o.upnl) ? usd(o.upnl) : '—'}</b></div>
            <div class="faint" style="font-size:12px">כמות ${nx(o.size ?? o.qty, 6)} · כניסה ${nx(o.fill ?? o.planEntry)} · סטופ ${nx(o.exSl || o.sl)} · יעד ${nx(o.exTp || o.tp)} · ${ago(o.at)}</div>
            ${o.syncErr ? `<div class="faint" style="font-size:11.5px;color:#fca5a5">${esc(o.syncErr)}</div>` : ''}
            <div style="margin-top:8px"><button class="btn dz sm" onclick="liveClose('${esc(o.linkId)}')" ${LV.closing[o.linkId] === 'sending' ? 'disabled' : ''}>
              ${LV.closing[o.linkId] === 'confirm' ? 'לחץ שוב לסגירה במחיר השוק' : LV.closing[o.linkId] === 'sending' ? 'סוגר…' : 'סגור עכשיו'}</button></div></div>`).join('')
          : '<div class="empty">אין פוזיציות אמיתיות פתוחות</div>'}
      </div>
      <div class="card"><div class="card-h"><h2>היסטוריית מסחר אמיתי</h2></div>
        ${lv.orders.filter(o => o.status === 'closed' || o.status === 'failed').length ? `<div class="tw" style="max-height:none"><table class="t"><thead><tr>
          <th>תאריך</th><th>מטבע</th><th>סביבה</th><th>כניסה</th><th>יציאה</th><th>סיבה</th><th>רווח/הפסד</th></tr></thead><tbody>
          ${lv.orders.filter(o => o.status === 'closed' || o.status === 'failed').map(o => `<tr class="${o.status === 'failed' ? '' : o.pnl >= 0 ? 'win' : 'loss'}">
            <td>${stamp(o.at)}</td><td><b>${esc(base(o.symbol))}</b></td><td>${o.env === 'mainnet' ? 'אמיתי' : 'testnet'}</td>
            <td class="num">${nx(o.fill)}</td><td class="num">${nx(o.exit)}</td>
            <td>${o.status === 'failed' ? `<span class="down">נכשלה: ${esc(o.err || '')}</span>` : esc(o.reason || '')}</td>
            <td class="num ${cls(o.pnl)}"><b>${o.status === 'failed' ? '—' : usd(o.pnl)}</b></td></tr>`).join('')}
          </tbody></table></div>` : '<div class="empty">עדיין אין</div>'}
      </div>
    </div>
    <div>
      <div class="card">${keys}</div>
      <div class="card"><div class="set-sec" style="margin:0"><h3>הגדרות מסחר אמיתי</h3>
        <div class="tog" style="margin-bottom:10px"><div>מסחר אמיתי<small>${lv.enabled ? 'פעיל — כפתורי ביצוע מופיעים' : 'כבוי'}</small></div>
          <button class="sw ${lv.enabled ? 'on' : ''}" onclick="liveSet('enabled',${!lv.enabled})"></button></div>
        <div class="tog" style="margin-bottom:12px"><div>סביבה<small>${esc(envName)}</small></div>
          <select style="width:auto" onchange="liveSet('env',this.value)">
            <option value="testnet" ${lv.env === 'testnet' ? 'selected' : ''}>Testnet</option>
            <option value="mainnet" ${lv.env === 'mainnet' ? 'selected' : ''}>כסף אמיתי</option></select></div>
        <div class="fields">
          ${[['alloc', 'הקצאה ($)', 10], ['riskPct', 'סיכון לעסקה (%)', .25], ['maxPositions', 'מקס׳ פוזיציות', 1], ['maxLossPct', 'נעילה אחרי הפסד (%)', 5],
             ['maxSlipPct', 'סטיית מחיר מותרת (%)', .1], ['maxAgeH', 'גיל איתות מקס׳ (שעות)', 1]].map(([k, l, st]) =>
            `<div><label>${l}</label><input type="number" step="${st}" value="${lv[k]}" onchange="liveSet('${k}',+this.value)"></div>`).join('')}
        </div>
        <div class="note">גודל הפוזיציה לעולם לא עובר את ההקצאה — בלי מינוף נסתר. הסטופ והיעד נשלחים לבורסה עם הפקודה.
          הזזת הסטופ לכניסה (אחרי 1R) נעשית רק כשהדף פתוח.</div></div></div>
    </div>
  </div>`;
}

</script>
</body>
</html>
